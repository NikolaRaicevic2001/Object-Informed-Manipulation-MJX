# Batch sweep: run `oim.run_launch` to completion, then exit.
#
# `launch.py job` fills in metadata.name, the image, the resources, the GPU
# affinity and the container command.
apiVersion: batch/v1
kind: Job
metadata:
  name: PLACEHOLDER
spec:
  # `run_launch` already survives a bad cell (unless --stop-on-error), so a
  # pod-level failure is real: no retry, which would re-run experiments.
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: gpu-container
          image: PLACEHOLDER
          imagePullPolicy: Always
          command: ["/bin/bash", "-lc"]
          args: ["PLACEHOLDER"]
          env:
            # Shared: keyed by the computation, so shards warm it for
            # each other.
            - name: OIM_JAX_CACHE_DIR
              value: /nikola-volume/oim/jax-cache
            # Read by the clone `launch.py` renders. `optional` so a missing
            # secret fails the clone visibly rather than blocking pod start.
            - name: GIT_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-token-nikola
                  key: GIT_ACCESS_TOKEN
                  optional: true
            - name: MUJOCO_GL
              value: egl
          volumeMounts:
            - mountPath: /nikola-volume
              name: nikola-volume
          resources:
            limits:
              nvidia.com/gpu: "1"
              memory: "32G"
              cpu: "8"
            requests:
              nvidia.com/gpu: "1"
              memory: "32G"
              cpu: "8"
      # Which GPUs this may land on; `--gpu-type` replaces the list.
      # Everything on the cluster at >= 16 GB, from nautilus/gpu_summary.py.
      # GH200 is excluded: aarch64, and the image is x86_64. 16-20 GB cards
      # are too small for a `--warp` xArm6 run -- drop `--warp` there.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      # 16 GB
                      - NVIDIA-A2
                      - NVIDIA-RTX-A4000
                      - Tesla-T4
                      - Tesla-V100-PCIE-16GB
                      - Tesla-V100-SXM2-16GB
                      # 20 GB
                      - NVIDIA-RTX-4000-Ada-Generation
                      # 24 GB
                      - NVIDIA-A10
                      - NVIDIA-GeForce-RTX-3090
                      - NVIDIA-GeForce-RTX-4090
                      - NVIDIA-L4
                      - NVIDIA-RTX-A5000
                      - NVIDIA-TITAN-RTX
                      - Quadro-RTX-6000
                      # 32 GB
                      - NVIDIA-RTX-5000-Ada-Generation
                      - Tesla-V100-SXM2-32GB
                      # 40 GB
                      - NVIDIA-A100-PCIE-40GB
                      # 48 GB
                      - NVIDIA-A40
                      - NVIDIA-L40
                      - NVIDIA-L40S
                      - NVIDIA-RTX-A6000
                      - Quadro-RTX-8000
                      # 80 GB
                      - NVIDIA-A100-80GB-PCIe
                      - NVIDIA-A100-SXM4-80GB
                      - NVIDIA-H100-80GB-HBM3
                      # 96 GB
                      - NVIDIA-RTX-PRO-6000-Blackwell-Max-Q-Workstation-Edition
                      # 141 GB
                      - NVIDIA-H200-NVL
      volumes:
        - name: nikola-volume
          persistentVolumeClaim:
            claimName: nikola-volume
