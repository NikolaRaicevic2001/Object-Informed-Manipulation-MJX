# Interactive pod for debugging and short runs by hand:
# `kubectl exec -it <name> -- /bin/bash`. A batch sweep belongs in
# job.yaml; this pod is never restarted and exits after its `sleep`.
#
# `launch.py pod` fills in metadata.name, the image, the resources, the GPU
# affinity and the container command.
apiVersion: v1
kind: Pod
metadata:
  name: PLACEHOLDER
spec:
  restartPolicy: Never
  containers:
    - name: gpu-container
      image: PLACEHOLDER
      imagePullPolicy: Always
      command: ["/bin/bash", "-lc"]
      # Replaced by `launch.py`, which clones the repo and points
      # oim/results at the PVC first. This literal is the fallback for a
      # bare `kubectl apply -f pod.yaml`, which does neither.
      args: ["sleep 86400"]
      env:
        # JAX compilation cache on the PVC: every sweep cell is its own
        # process, so without it each recompiles from scratch.
        - name: OIM_JAX_CACHE_DIR
          value: /nikola-volume/oim/jax-cache
        # Read by the clone `launch.py` renders. `optional` so a missing
        # secret fails the clone visibly rather than blocking pod start.
        - name: GIT_ACCESS_TOKEN
          valueFrom:
            secretKeyRef:
              name: github-token-nikola
              key: GIT_ACCESS_TOKEN
              optional: true
        # Offscreen rendering for `--record`; there is no display here.
        - name: MUJOCO_GL
          value: egl
      volumeMounts:
        - mountPath: /nikola-volume
          name: nikola-volume
      # Requests track measured usage (~1 core, ~5 GB); NRP's admission
      # webhook blocks new pods when the account requests far more than
      # it uses. Limits stay higher so a spike bursts instead of OOMing.
      resources:
        limits:
          nvidia.com/gpu: "1"
          memory: "16G"
          cpu: "4"
        requests:
          nvidia.com/gpu: "1"
          memory: "8G"
          cpu: "2"
  # Which GPUs this may land on; `--gpu-type` replaces the list.
  # Everything on the cluster at >= 16 GB, from nautilus/gpu_summary.py.
  # GH200 is excluded: aarch64, and the image is x86_64. 16-20 GB cards
  # are too small for a `--warp` xArm6 run -- drop `--warp` there.
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values:
                  # 16 GB
                  - NVIDIA-A2
                  - NVIDIA-RTX-A4000
                  - Tesla-T4
                  - Tesla-V100-PCIE-16GB
                  - Tesla-V100-SXM2-16GB
                  # 20 GB
                  - NVIDIA-RTX-4000-Ada-Generation
                  # 24 GB
                  - NVIDIA-A10
                  - NVIDIA-GeForce-RTX-3090
                  - NVIDIA-GeForce-RTX-4090
                  - NVIDIA-L4
                  - NVIDIA-RTX-A5000
                  - NVIDIA-TITAN-RTX
                  - Quadro-RTX-6000
                  # 32 GB
                  - NVIDIA-RTX-5000-Ada-Generation
                  - Tesla-V100-SXM2-32GB
                  # 40 GB
                  - NVIDIA-A100-PCIE-40GB
                  # 48 GB
                  - NVIDIA-A40
                  - NVIDIA-L40
                  - NVIDIA-L40S
                  - NVIDIA-RTX-A6000
                  - Quadro-RTX-8000
                  # 80 GB
                  - NVIDIA-A100-80GB-PCIe
                  - NVIDIA-A100-SXM4-80GB
                  - NVIDIA-H100-80GB-HBM3
                  # 96 GB
                  - NVIDIA-RTX-PRO-6000-Blackwell-Max-Q-Workstation-Edition
                  # 141 GB
                  - NVIDIA-H200-NVL
  volumes:
    - name: nikola-volume
      persistentVolumeClaim:
        claimName: nikola-volume
