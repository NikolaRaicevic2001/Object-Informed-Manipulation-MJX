# Interactive pod: the image, a GPU and the PVC, doing nothing.
#
# For building, debugging and short runs by hand. `launch.py pod` fills in
# metadata.name, the image, the resources, the GPU affinity and the
# container command; everything else is here.
#
#   kubectl exec -it <name> -- /bin/bash
#
# A batch sweep belongs in `job.yaml` -- a pod is not restarted or cleaned
# up, and this one exits after its `sleep`.
apiVersion: v1
kind: Pod
metadata:
  name: PLACEHOLDER
spec:
  restartPolicy: Never
  containers:
    - name: gpu-container
      image: PLACEHOLDER
      imagePullPolicy: Always
      command: ["/bin/bash", "-lc"]
      # Replaced by `launch.py`, which clones the repo and points
      # oim/results at the PVC first. This literal is the fallback for a
      # bare `kubectl apply -f pod.yaml`, which does neither.
      args: ["sleep 86400"]
      env:
        # Persist the JAX compilation cache on the PVC. Every sweep cell is
        # its own process, so without this each one recompiles from scratch
        # -- ~10 s per cell. See `oim/__init__.py`.
        - name: OIM_JAX_CACHE_DIR
          value: /nikola-volume/oim/jax-cache
        # Read by the clone `launch.py` renders. `optional` so a missing
        # secret fails the clone visibly rather than blocking pod start.
        - name: GIT_ACCESS_TOKEN
          valueFrom:
            secretKeyRef:
              name: github-token-nikola
              key: GIT_ACCESS_TOKEN
              optional: true
        # Offscreen rendering for `--record`; there is no display here.
        - name: MUJOCO_GL
          value: egl
      volumeMounts:
        - mountPath: /nikola-volume
          name: nikola-volume
      resources:
        limits:
          nvidia.com/gpu: "1"
          memory: "16G"
          cpu: "4"
        requests:
          nvidia.com/gpu: "1"
          memory: "16G"
          cpu: "4"
  # Which GPUs this may land on; `launch.py --gpu-type` replaces the list.
  # Floored at 24 GB: `--warp` disables JAX preallocation so MuJoCo Warp can
  # build its CUDA graphs, and 16 GB is not enough for the xArm6 scene.
  # Excluded: `-MIG-1g.10gb` (a 10 GB slice), GH200 (aarch64).
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values:
                  # 24 GB: 634 GPUs, of which 24 are 4090s.
                  - NVIDIA-GeForce-RTX-4090
                  - NVIDIA-GeForce-RTX-3090
                  - NVIDIA-RTX-A5000
                  - NVIDIA-A10
                  - NVIDIA-L4
                  - NVIDIA-TITAN-RTX
                  - Quadro-RTX-6000
                  # 32-48 GB.
                  - Tesla-V100-SXM2-32GB
                  - NVIDIA-A40
                  - NVIDIA-L40
                  - NVIDIA-L40S
                  - NVIDIA-RTX-A6000
                  - Quadro-RTX-8000
                  # 40-80 GB.
                  - NVIDIA-A100-PCIE-40GB
                  - NVIDIA-A100-80GB-PCIe
                  - NVIDIA-A100-SXM4-80GB
  volumes:
    - name: nikola-volume
      persistentVolumeClaim:
        claimName: nikola-volume
