# Batch sweep: run `oim.run_launch` to completion, then exit.
#
# `launch.py job` fills in metadata.name, the image, the resources and the
# container command (the sweep it runs and any `--only` shard filter).
# Results are written to the PVC, not into the image -- see the symlinks
# `launch.py` builds, which point `oim/results` and `oim/recordings` at
# /nikola-volume so a finished job leaves its run files behind.
apiVersion: batch/v1
kind: Job
metadata:
  name: PLACEHOLDER
spec:
  # A sweep cell that dies takes the whole job down rather than silently
  # re-running an experiment: `run_launch --keep-going` already survives a
  # single bad cell, so a pod-level failure here is a real one.
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: gpu-container
          image: PLACEHOLDER
          imagePullPolicy: Always
          command: ["/bin/bash", "-lc"]
          args: ["PLACEHOLDER"]
          env:
            # Shared across every job, deliberately: the cache is keyed by
            # the compiled computation, so shards warm it for each other.
            - name: OIM_JAX_CACHE_DIR
              value: /nikola-volume/oim/jax-cache
            # Read by the clone `launch.py` renders. `optional` so a missing
            # secret fails the clone visibly rather than blocking pod start.
            - name: GIT_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-token-nikola
                  key: GIT_ACCESS_TOKEN
                  optional: true
            - name: MUJOCO_GL
              value: egl
          volumeMounts:
            - mountPath: /nikola-volume
              name: nikola-volume
          resources:
            limits:
              nvidia.com/gpu: "1"
              memory: "32G"
              cpu: "8"
            requests:
              nvidia.com/gpu: "1"
              memory: "32G"
              cpu: "8"
      # Which GPUs this may land on; `launch.py --gpu-type` replaces the list.
      # Floored at 24 GB: `--warp` disables JAX preallocation so MuJoCo Warp can
      # build its CUDA graphs, and 16 GB is not enough for the xArm6 scene.
      # Excluded: `-MIG-1g.10gb` (a 10 GB slice), GH200 (aarch64).
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      # 24 GB: 634 GPUs, of which 24 are 4090s.
                      - NVIDIA-GeForce-RTX-4090
                      - NVIDIA-GeForce-RTX-3090
                      - NVIDIA-RTX-A5000
                      - NVIDIA-A10
                      - NVIDIA-L4
                      - NVIDIA-TITAN-RTX
                      - Quadro-RTX-6000
                      # 32-48 GB.
                      - Tesla-V100-SXM2-32GB
                      - NVIDIA-A40
                      - NVIDIA-L40
                      - NVIDIA-L40S
                      - NVIDIA-RTX-A6000
                      - Quadro-RTX-8000
                      # 40-80 GB.
                      - NVIDIA-A100-PCIE-40GB
                      - NVIDIA-A100-80GB-PCIe
                      - NVIDIA-A100-SXM4-80GB
      volumes:
        - name: nikola-volume
          persistentVolumeClaim:
            claimName: nikola-volume
