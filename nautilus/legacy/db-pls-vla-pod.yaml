apiVersion: v1
kind: Pod
metadata:
  name: pls-vla-training-pod-template
spec:
  containers:
  - name: gpu-container
    image: nikolaraicevic2001/pls-vla:latest
    imagePullPolicy: Always
    command: ["/bin/bash", "-c"]
    args: ["sleep 86400"]
    env:
    - name: WANDB_API_KEY
      valueFrom:
        secretKeyRef:
          name: wandb-secret
          key: api-key
    - name: HF_TOKEN
      valueFrom:
        secretKeyRef:
          name: hf-token-secret
          key: hf-access-token
    - name: GIT_ACCESS_TOKEN
      valueFrom:
        secretKeyRef:
          name: github-token-nikola
          key: GIT_ACCESS_TOKEN
    volumeMounts:
    - mountPath: /pers_vol
      name: db-cephfs-volume
    - mountPath: /nikola_vol
      name: nikola-volume
    # PyTorch DataLoader workers need enough POSIX shm; default /dev/shm is ~64Mi in K8s.
    - mountPath: /dev/shm
      name: dshm
    resources:
      limits:
        nvidia.com/gpu: "1"
        memory: "32G"
        cpu: "2.0"
      requests:
        nvidia.com/gpu: "1"
        memory: "30G"
        cpu: "1.8"
  restartPolicy: Never
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: nvidia.com/gpu.product
            operator: In
            values:
            - "NVIDIA-GH200-480GB"
            - "NVIDIA-A100-80GB-PCIe"
            - "NVIDIA-A100-SXM4-80GB"
            - "NVIDIA-A100-80GB-PCIe-MIG-1g.10gb"
            - "NVIDIA-RTX-A6000"
            - "NVIDIA-L40S"
            - "NVIDIA-L40"
            - "NVIDIA-A40"
            - "NVIDIA-A100-PCIE-40GB"
            - "TESLA-V100-SXM2-32GB"
            - "NVIDIA-RTX-5000-Ada-Generation"
            - "NVIDIA-GeForce-RTX-4090"
            - "NVIDIA-GeForce-RTX-3090"
            - "NVIDIA-RTX-A5000"
            - "NVIDIA-TITAN-RTX"
            - "NVIDIA-A10"
            - "NVIDIA-L4"
            - "Quadro-RTX-6000"

  volumes:
    - name: db-cephfs-volume
      persistentVolumeClaim:
        claimName: db-cephfs-volume
    - name: nikola-volume
      persistentVolumeClaim:
        claimName: nikola-volume
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 16Gi
