world3d:
  planning_dt: 0.05       # planner rollout timestep
  planning_iterations: 40
  planning_ls_iterations: 30
  exec_timestep: 0.002    # execution model timestep
  exec_iterations: 100    # execution model solver iterations
  exec_ls_iterations: 50  # execution model line-search iterations

world2d:                  # unused for this robot
  mass: 2.0
  mu: 0.4                 # object/support friction
  mu_c: 0.5                # robot/object friction
  f_max: 4.0               # cap on the normal contact force

sampler:
  num_samples: 64
  horizon: 32
  # Flat baseline's own sample budget/horizon, read instead of
  # num_samples/horizon above by _run_3d when the algorithm is not ADMM.
  flat_num_samples: 256
  flat_horizon: 32
  robot_num_knots: 8
  robot_spline: linear
  object_spline: zero
  iterations: 1
  mppi:
    # Per-joint noise std, [joint1..joint5]. Joint 1 alone moves the tip
    # xy at zero tilt cost, so it explores widest; joint 4 (a velocity
    # actuator with no position hold) needs a nonzero floor or its mean
    # never moves at all.
    noise_level: [0.45, 0.3, 0.3, 0.005, 0.2]
    temperature: 0.5
    # Flat baseline only. Shrinks exploration noise as pos_err -> 0; off.
    noise_anneal_dist: 0.0
    noise_anneal_min: 0.4
    eta_frac_high: 0.0
    eta_frac_low: 0.0
    temp_sharpen: 0.9
    temp_widen: 1.2
    temp_min: 0.1
    temp_max: 2.5
  cem:
    num_elites: 8
    sigma_start: 0.5
    sigma_min: 0.1
  ps:
    noise_level: 0.5
  cbo:
    initial_noise_level: 0.5
    temperature: 0.5
    consensus_weight: 1.0
    noise_weight: 1.0
    step_size: 0.1
  object:
    num_samples: 256          # object block only; unset shares `num_samples`
    mppi:
      noise_level: 0.25
      temperature: 0.5

costs:
  q_pos: 200.0
  q_theta: 16.0
  qf_pos: 200.0
  qf_theta: 16.0
  # Flat baseline only. Ramps q_theta/qf_theta up to q_theta_ramp x as
  # pos_err -> 0 over theta_ramp_dist -- counters position-driven pushing
  # knocking an already-converged orientation back out. 1.0 = inert.
  q_theta_ramp: 3.0
  theta_ramp_dist: 0.15
  q_ramp_per_step: 0.002  # q_pos/q_theta grow 0.2% per real control step
  q_ramp_max: 25.0         # ...capped at this multiple

  w_effort: 0.01
  wrench_fraction: 1.4
  w_rate: [2.0, 2.0, 1.0]
  # Object-vs-obstacle clearance, "exp" mode: w_obstacle * exp(-d/obstacle_decay).
  # obstacle_margin is inert here (only read in "hinge" mode); kept for
  # pusher_obstacle_margin's separate, still-hinge robot-tip clearance.
  w_obstacle: 10.0
  obstacle_decay: 0.05
  obstacle_margin: 0.05

  w_robot_effort: 0.05          # squared control effort; pinned at 0.10-0.12/step
  w_approach: 60.0
  r0: 0.075                     # 5cm approach deadzone
  w_align: 30.0
  # Alignment cone half-angle. single_obstacle does better at 45 deg, but
  # 45 applied globally drops open_table -- pass `--gamma0-deg 45`
  # explicitly for single_obstacle instead.
  gamma0_deg: 30.0
  w_tilt: 80.0
  w_z_tip: 40.0       # tip height at/above block mid-height (quadratic)
  w_z_tip_exp: 1.0    # tip height below block mid-height (exponential, cm)
  # Kinematic hover-slab contact_z (PushT._contact_z_cost): exponential
  # floor value at the slab's outer edge (1cm above the block's top
  # surface), rising toward the surface, capped at contact_z_cap.
  w_contact_z_exp: 200.0
  # Cap on that exponential. At w_contact_z_exp=200 the raw exponential
  # peaks at 200*exp(4)=10920 at the surface, so this trades off gradient
  # strength near the top face against not over-prohibiting the fine
  # orientation nudges that graze it (see Tasks.md for the tuning history).
  contact_z_cap: 5000.0
  # Pressing into the top face costs this many times what hovering the
  # same distance above it does.
  contact_z_below_mult: 3.0
  w_joint3_cave_exp: 1.0
  joint3_cave_z_threshold: 0.25
  shaping_fade_dist: 0.25
  tip_softening_dist: 0.25
  fade_floor: 0.0
  # xarm6 only -- see _robot_obstacle_cost/_pusher_obstacle_cost.
  pusher_obstacle_weight: 0.5
  pusher_obstacle_margin: 0.06

admm:
  robot_opt: mppi
  object_opt: mppi
  n_admm: 4
  rho: 1.0
  rho_adapt: false              # residual-balancing rule; off => rho stays at `rho`
  rho_bound_factor: 8.0         # when rho_adapt: how far the rule may move rho
  gamma: 0.1
  eps_r: 0.5
  eps_s: 0.5
  noise_min: 0.0
  noise_kappa: 0.0
  noise_max: 0.0
  consensus_alpha: 1.0
  local_goal: false

run:
  seed: 5
  steps: 2000
  goal_pos_tol: 0.05
  goal_theta_tol: 0.05
  show_samples: false
  show_optimal: false
