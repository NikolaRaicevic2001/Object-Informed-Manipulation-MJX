world3d:
  planning_dt: 0.05       # planner rollout timestep
  exec_timestep: 0.002    # execution model timestep
  exec_iterations: 100    # execution model solver iterations
  exec_ls_iterations: 50  # execution model line-search iterations

world2d:                  # unused for this robot
  mass: 2.0
  mu: 0.4                 # object/support friction
  mu_c: 0.5               # robot/object friction
  f_max: 4.0              # cap on the normal contact force

sampler:
  num_samples: 64
  horizon: 32
  # TEMPORARY (2026-08-14, see Tasks.md and oim/experiment.py's _run_3d):
  # lets the flat baseline (vanilla MPPI/ps/cbo/cem) use its own sample
  # budget/horizon instead of num_samples/horizon above, which ADMM also
  # reads. Flat MPPI's validated tuning (128/25) has diverged from what's
  # set for ADMM here (64/32) -- changing the shared values would move
  # ADMM's numbers too. Remove both keys (and the override in
  # experiment.py) once there is agreement to use one shared value for
  # both again -- not meant to be a permanent second knob.
  flat_num_samples: 256
  flat_horizon: 32
  robot_num_knots: 8
  robot_spline: linear
  object_spline: zero
  iterations: 1
  mppi:
    # Per-joint noise std (2026-08-16, per Shahid), replacing the single
    # scalar 0.3 for every joint -- joint order [1,2,3,4,5], matching
    # ctrl index (confirmed via actuator_trnid, not assumed from naming).
    # Motivated by a Jacobian check (see Tasks.md): joint 1 alone moves
    # the tip xy with zero tilt cost; every other joint costs the same
    # tilt per unit noise whether or not it's buying useful z-reach
    # (joints 2/3) or redundant xy motion joint 1 already gives for free
    # (joints 4/5). Round 1 (joint 1 up, joints 3+4 down, 2+5 left alone)
    # was a mistake in what Shahid meant to specify -- superseded by
    # round 2 here before round 1 was properly evaluated. Round 2: joint
    # 1 up (0.3->0.45), joints 4 and 5 down (0.3->0.2), joints 2 and 3
    # left at the original 0.3 -- see Tasks.md.
    # Shared with ADMM's robot_opt: mppi block, same as every other key
    # in this section -- not scoped to the flat baseline. Untested
    # before this round; see Tasks.md.
    # Fallback test (2026-08-16, per Shahid) tried and clearly lost:
    # every joint at uniform 0.3 except joint 2 alone at 0.45 -- zero
    # steps under goal_theta_tol across 3 runs, vs. 144 and 1038 steps
    # for the config below. See Tasks.md Phase 13c.
    # joint 4: 0 -> 0.005 (2026-08-18, per Shahid). At exactly 0, every
    # sampled u4 equals the mean (perturbation is always zero), so the
    # weighted-average update can never move the mean off its initial
    # value regardless of incurred cost -- MPPI has zero information to
    # act on for this dimension. It's a velocity actuator with no
    # position-holding term (see xarm6.xml's xarm6_motor4 comment), so
    # with the commanded velocity permanently pinned at the initial
    # mean, external dynamic coupling (Coriolis/contact reaction torques
    # from the other 4 joints moving aggressively) was free to drift
    # joint4 by a full uncorrected revolution over a real run (see
    # Tasks.md) with nothing available to counter it. 0.005 (vs. the
    # working joints' 0.2-0.45) reopens just enough exploration for the
    # mean to move at all -- intentionally not a spring/position-hold:
    # unlike a passive joint stiffness, this leaves joint4 free to be
    # driven for real later if a task ever needs it, rather than
    # permanently anchoring it at 0.
    noise_level: [0.45, 0.3, 0.3, 0.005, 0.2]
    temperature: 0.5
    # Flat baseline only -- read by `_run_plain`, not by ADMM's loop, so
    # inert for the object/robot ADMM blocks even though they share this
    # block. noise_anneal_* (shrink exploration noise as pos_err -> 0):
    # tested and REJECTED -- killed every success in isolation, left at
    # 0/inert.
    noise_anneal_dist: 0.0
    noise_anneal_min: 0.4
    # stuck_kick_* (2026-08-15 - 2026-08-18): after this many consecutive
    # no-progress control steps, perturb the sampling mean by a large
    # random jump to escape a stuck contact -- tuned across several
    # rounds to 150 steps/scale 2.0 (see Tasks.md for the sweep), then
    # removed entirely (2026-08-18, per Shahid): now that the arm is
    # stable, a sudden large mean perturbation reads as a dangerous,
    # unpredictable jerk rather than a recovery. Mechanism deleted from
    # `oim.algs.mppi.MPPI` and `oim.worlds.sim3d.run`'s closed loop, not
    # just zeroed here -- these keys no longer exist.
    # Adaptive temperature, round 2 (2026-08-15): re-tested more
    # aggressively (eta_frac_high 0.3, temp_sharpen 0.6, temp_min 0.02)
    # against open_table, seed 0, isolated from the w_ee=40 revert below
    # by a same-day control run. Made it worse again, more so than round
    # 1: froze from step 661 for 1340/2000 steps (pos_err 0.233, theta_err
    # 0.158) vs. the w_ee=40-only control's step 1207/794 steps
    # (pos_err 0.006, theta_err 0.173 -- see "Current state" issue 1).
    # Reverted to 0.0/0.0 again. See Tasks.md.
    eta_frac_high: 0.0
    eta_frac_low: 0.0
    temp_sharpen: 0.9
    temp_widen: 1.2
    temp_min: 0.1
    temp_max: 2.5
  cem:
    num_elites: 8
    sigma_start: 0.5
    sigma_min: 0.1
  ps:
    noise_level: 0.5
  cbo:
    initial_noise_level: 0.5
    temperature: 0.5
    consensus_weight: 1.0
    noise_weight: 1.0
    step_size: 0.1
  object:
    num_samples: 256          # object block only; unset shares `num_samples`
    mppi:
      noise_level: 0.25
      temperature: 0.5

costs:
  # Pulled toward the reference IsaacGym baseline's own vanilla-MPPI
  # weights (target_to_goal=100, target_ori=8) -- see Tasks.md's
  # formulation comparison for the full reasoning.
  q_pos: 200.0
  q_theta: 16.0
  qf_pos: 200.0
  qf_theta: 16.0
  # Flat baseline only. Ramps q_theta/qf_theta up to q_theta_ramp x as
  # pos_err -> 0 (over theta_ramp_dist below) -- counters position-driven
  # pushing knocking an already-converged orientation back out. 1.0 =
  # inert. Round 3 (2026-08-15, per Shahid): theta_ramp_dist back to
  # 0.15 (Phase 6's 0.10 narrowing isolated back out), q_theta_ramp kept
  # at 3.0 (Phase 6's doubling from 1.5, not reverted) -- single-variable
  # change from Phase 6, to tell whether the narrower radius or the
  # doubled ceiling was driving Phase 6's mixed/high-variance result.
  # See Tasks.md Phase 7 for the isolated test result.
  q_theta_ramp: 3.0
  theta_ramp_dist: 0.15
  q_ramp_per_step: 0.002  # q_pos/q_theta grow 0.2% per real control step
  q_ramp_max: 12.0         # ...capped at 4x (q_pos<=800, q_theta<=64)

  w_effort: 0.01
  wrench_fraction: 1.4
  w_rate: [2.0, 2.0, 1.0]
  # Object-vs-obstacle clearance, "exp" mode as of 2026-08-19 (see
  # PlanarPushingObject.obstacle_cost) -- switched from "hinge" (zero
  # cost/gradient until obstacle_margin, then quadratic) after real
  # single_obstacle/YCB-clutter runs showed the object getting stuck
  # against an obstacle instead of avoiding it, since "hinge" gives no
  # avoidance signal at all outside the margin. w_obstacle/obstacle_decay
  # here are the point robot's own validated "exp" values (point.yaml),
  # used as the starting point rather than retuned from scratch --
  # 60000.0 (the old "hinge" weight, cost at full penetration) would be
  # wildly oversized for "exp"'s cost-at-zero-clearance semantics.
  # obstacle_margin is now inert for the object cost (only read in
  # "hinge" mode) -- kept, still used by pusher_obstacle_margin's
  # separate, still-hinge robot-tip clearance mechanism.
  w_obstacle: 10.0
  obstacle_decay: 0.01
  obstacle_margin: 0.015

  r_r: 0.05                     # squared control effort; pinned at 0.10-0.12/step
  w_ee: 60.0
  r0: 0.05                     # 5cm approach deadzone
  w_align: 30.0
  gamma0_deg: 30.0              # alignment cone half-angle; single_obstacle
  # does much better at 45 (measured), but 45 applied globally drops
  # open_table -- no single value serves every scene, hence the
  # `--gamma0-deg` CLI override (oim/experiment.py). Pass
  # `--gamma0-deg 45` explicitly when running single_obstacle.
  w_tilt: 80.0
  w_z_tip: 40.0       # tip height at/above block mid-height (quadratic)
  w_z_tip_exp: 1.0    # tip height below block mid-height (exponential, cm)
  w_contact_z_exp: 1.0
  w_joint3_cave_exp: 1.0
  # 0.20 -> 0.275 (2026-08-18, per Shahid): 0.20 only caught link3 once
  # already part way into the caved collapse; 0.275 sits at/above the
  # observed normal-operation floor (~0.25) so the exponential fires
  # before the arm ever enters that configuration, not after.
  joint3_cave_z_threshold: 0.25
  shaping_fade_dist: 0.25
  tip_softening_dist: 0.25
  fade_floor: 0.01
  # xarm6 only -- see _robot_obstacle_cost/_pusher_obstacle_cost.
  # w_robot_contact (DEFAULT_COSTS) is never read for this embodiment;
  # not overridden here since it would do nothing.
  pusher_obstacle_weight: 0.5
  pusher_obstacle_margin: 0.06

admm:
  robot_opt: mppi
  object_opt: mppi
  n_admm: 4
  rho: 1.0
  rho_adapt: false              # residual-balancing rule; off => rho stays at `rho`
  rho_bound_factor: 8.0         # when rho_adapt: how far the rule may move rho
  gamma: 0.1
  eps_r: 0.5
  eps_s: 0.5
  noise_min: 0.0
  noise_kappa: 0.0
  noise_max: 0.0
  consensus_alpha: 1.0
  local_goal: false

run:
  seed: 5
  steps: 2000
  goal_pos_tol: 0.05
  goal_theta_tol: 0.05
  show_samples: false
  show_optimal: false
