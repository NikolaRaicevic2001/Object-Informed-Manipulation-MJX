world3d:
  planning_dt: 0.05             # sub-optimizer rollout timestep
  robot_substeps: 5             # MJX steps per planning step in the ROBOT rollout: contact integrates at planning_dt/robot_substeps, the horizon keeps its length. Costs ~robot_substeps x. Measured vs the execution model, predicted/executed object travel: 1.248 at 1, 0.990 at 5, 1.016 at 10
  object_substeps: 1            # OBJECT WORLD: MJX steps per planning step in the OBJECT rollout, under --plant mujoco. 1 gives eq. 5's own coarse integration
  planning_iterations: 40       # flat baselines only: planner-model solver iterations (ADMM builds its own PushT and uses the MJCF's)
  planning_ls_iterations: 30    # flat baselines only: planner-model line-search iterations
  exec_timestep: 0.002          # execution-model MuJoCo timestep
  exec_iterations: 100          # execution-model solver iterations
  exec_ls_iterations: 50        # execution-model line-search iterations

world2d:                       
  mass: 2.0     
  mu: 0.4                       # object/support friction
  mu_c: 0.5                     # robot/object friction
  f_max: 4.0                    # cap on the normal contact force

sampler:
  num_samples: 128              # rollouts per iteration (MPPI: 256, ADMM: 128)
  horizon: 24                   # planning horizon H, in steps of planning_dt. (MPPI: 32, ADMM: 24)
  robot_num_knots: 6            # number of knots for the robot spline
  robot_spline: linear          # robot spline type: linear | cubic | quintic
  object_spline: zero           # object spline type: zero | linear | cubic | quintic
  iterations: 1                 # optimizer passes per control step: flat 3D baselines, and the object world. ADMM's own blocks get `n_admm` passes instead, so matching this to n_admm is what makes an object-only run the same experiment as the ADMM block
  mppi:                         # MPPI optimizer parameters
    noise_level: [0.45, 0.3, 0.3, 0.005, 0.2]  # per-joint std [joint1..joint5]: joint 1 moves the tip xy at zero tilt cost so it explores widest; joint 4 is a velocity actuator with no position hold, so 0 there freezes its mean
    temperature: 0.5            # MPPI softmax: weight_i = softmax(-J_i/temperature), higher -> more exploration
  cem:                          # CEM optimizer parameters
    num_elites: 8
    sigma_start: 0.5
    sigma_min: 0.1
  ps:                           # PS optimizer parameters
    noise_level: 0.5
  cbo:                          # CBO optimizer parameters
    initial_noise_level: 0.5
    temperature: 0.5
    consensus_weight: 1.0
    noise_weight: 1.0
    step_size: 0.1
  object:                       # Object optimizer parameters
    num_samples: 256            # object block only; unset shares `num_samples`
    mppi:
      noise_level: 0.2
      temperature: 0.1

costs:
  # x^o = object SE(2) pose, g = goal, p = xy, u = robot command,
  # w = object wrench, d = distance from the object's footprint to the
  # NEAREST obstacle, f = robot-vs-obstacle contact normal force [N],
  # z_tip = stick tip world height, psi = stick tilt from straight down.

  # Shared costs -- read by BOTH subproblems, at the same weight.
  q_pos: 200.0                  # goal position gain:    ell_o = ramp * (q_pos*||p - p_g||^2 + q_theta*wrap(th - th_g)^2)
  q_theta: 16.0                 # goal heading gain:     same formula, the wrap(th - th_g)^2 half
  qf_pos: 200.0                 # terminal position gain: ell_f = qf_pos*||p_H - p_g||^2 + qf_theta*wrap(th_H - th_g)^2
  qf_theta: 16.0                # terminal heading gain:  same formula, the wrap(th_H - th_g)^2 half
  q_ramp_per_step: 0.005        # goal-tracking ramp, BOTH blocks, on the goal terms only: ramp = clip((1 + q_ramp_per_step)^(t/dt), 1, q_ramp_max), t read once per horizon
  q_ramp_max: 25.0              # cap on that ramp
  w_obstacle: 20.0              # object-vs-obstacle proximity: w_obstacle * exp(-d/obstacle_decay), nearest obstacle only
  obstacle_decay: 0.06          # decay length [m] in that exponential: halves the penalty every obstacle_decay*ln2 of clearance
  w_support: 200.0              # object-vs-TABLE-EDGE, a keep-IN region: w_support * sum over footprint of clip(d + support_margin, 0, inf)^2
  support_margin: 0.2           # how far inside the rim [m] it starts; 0 until then

  # Object costs -- object subproblem 
  wrench_fraction: 1.5                # NOT a cost: object action scale, action_scale = wrench_fraction * wrench_limit (wrench/pose:1.5, contact_point:2.5)
  w_effort: 0.01                      # object wrench effort: w_effort * ||w||^2
  w_rate: [8.0, 8.0, 1.0]             # object wrench rate, per axis [fx, fy, tau]: sum_t sum_i w_rate[i] * (w[t+1,i]/limit_i - w[t,i]/limit_i)^2
  w_contact_rate: [8.0, 8.0, 1.0]     # contact-point rate, per axis [px, py, lambda], consensus=contact_point only: sum_t sum_i w[i]*(A[t+1,i]/scale_i - A[t,i]/scale_i)^2, scale = [r_body, r_body, f_max]. The only term that knows relocating a contact costs the ARM many steps while the object block can teleport it for free; too low and the robot chases a target that moves every step

  # Arm costs -- robot subproblem 
  w_robot_effort: 0.05          # robot control effort: fade * w_robot_effort * ||u||^2
  w_approach: 60.0              # approach: fade * w_approach * max(||p_ee - p||^2 - r0^2, 0), pulls the tip onto the object
  r0: 0.075                     # approach deadband radius [m]: no approach cost inside ||p_ee - p|| <= r0
  w_align: 30.0                 # stay behind the object: fade * w_align * max(cos(gamma0_deg) - cos(angle), 0), angle between (p - p_ee) and (p_ref - p)
  gamma0_deg: 30.0              # alignment cone half-angle [deg] in that hinge. single_obstacle does better at 45, but 45 globally drops open_table -- pass `--gamma0-deg 45` for that scene
  w_tilt: 80.0                  # keep the stick pointing down: fade * w_tilt * (1 - cos(psi))
  w_z_tip: 4.5                  # tip height AT/ABOVE block mid-height: fade * w_z_tip * (100*(z_tip - tip_target_z))^2, per cm^2 of height error
  w_z_tip_exp: 1.0              # tip height BELOW it: w_z_tip_exp * exp(gap_cm^2), gap_cm = 100*(tip_target_z - z_tip). A table strike is dangerous on hardware, not merely costly
  w_contact_z_exp: 200.0        # top-riding: inside the footprint (inflated by contact_z_margin) and within contact_z_slab of the block's top face, w_contact_z_exp * exp((2*(1 - clip(|dz|/contact_z_slab, 0, 1)))^2), dz = z_tip - top face. Uncapped, but bounded: the exponent tops out at 4, so the peak is w_contact_z_exp * e^4 = 10920 on the surface
  contact_z_slab: 0.015         # half-thickness [m] of that slab, either side of the top face. Sets both the reach and the steepness, since the exponential is normalized by it
  contact_z_margin: 0.008       # outward inflation [m] of that footprint test: sdf(local_xy) <= this, not <= 0. When the stick's SIDE rests on the block's top EDGE its centre sits about one stick radius (5.55mm, oim/models/xarm6/xarm6.xml) outside the outline, so the strict test reads "outside" and the barrier never fires -- the exact posture the real runs were riding in, and the one the sim runs show as edge-pushing. Only affects the top band; a legitimate side push sits below it
  w_robot_contact: 0.1          # robot-vs-obstacle contact: w_robot_contact * f^2, so a hard hit costs far more than a graze. Proximity is free -- the arm may reach past an obstacle. UNMEASURED weight
  shaping_fade_dist: 0.25       # shaping fade radius [m]: fade = clip(||p - p_g||/shaping_fade_dist, 0, 1), scales approach/align/tilt/effort AND the ADMM consensus penalty

admm:
  plant: mujoco                 # OBJECT WORLD ONLY: dynamics the run predicts AND executes with -- analytic (eq. 5 both sides) | mujoco (MJX plans, MuJoCo executes). Both are self-consistent; there is no mixed mode. The 3D `admm` subcommand has its own --plant and does NOT read this: switching it there would reprice every recorded 3D run
  friction: box                 # OBJECT WORLD ONLY, --plant mujoco only: shape of the simulated support friction -- box (per-DoF frictionloss, the only one that converges on every scene) | cone (eq. 5's own coupled ellipsoid) | wrench (eq. 5's force balance; diverges, the block coasts). See oim/worlds/object_only/plant.py
  robot_opt: mppi               # robot optimizer: mppi | cem | ps | cbo
  object_opt: mppi              # object optimizer: mppi | cem | ps | cbo
  consensus: 
    # wrench             # wrench = [fx, fy, tau]
    # contact_point      # contact_point = [px, py, lambda], a boundary point in the object's body frame + normal force, with w = J_c^T f derived at the current pose each step
    object_pose        # object_pose = [x, y, yaw], the pose eq. 5 produces; the block still samples wrenches, so the object-only world behaves like `wrench`. yaw is wrapped in every ADMM subtraction
  n_admm: 3
  rho: 2.0                      # ADMM step size
  rho_torque: 2.0               # ADMM step size for the torque channel: rho_init = [rho, rho, rho_torque]. 10.0 was the implicit fallback while this key was absent, so writing it here changes nothing
  rho_adapt: false              # residual-balancing rule; off => rho stays at `rho`
  rho_bound_factor: 8.0         # when rho_adapt: how far the rule may move rho
  gamma: 0.1                    # proximal weight: (gamma/2)*||U - U_prev||^2 
  consensus_object_weight: 0.8  # object block's share w_o of the consensus update: z <- w_o*(A^o + y_o) + (1 - w_o)*(A^r + y_r). 0.5 = the paper's average; >0.5 tilts z toward the object block's cleaner 3-DOF plan, <0.5 toward the robot's realized wrench
  eps_r: 0.5                    # early exit: rounds stop once primal_res <= eps_r and dual_res <= eps_s
  eps_s: 0.5                    # ...the dual half of that test
  local_goal: false             # robot block tracks the object block's own PLAN instead of the global goal, in ell_o and the terminal term only; snaps back to the global goal inside shaping_fade_dist
  local_goal_lookahead: 0.25    # how tightly it follows that plan: aim at the first planned pose >= this far [m] from the object, re-picked every rollout step so the carrot slides along the route. 0 = aim at the plan's endpoint only (the old behaviour)

run:
  seed: 5
  steps: 2000
  goal_pos_tol: 0.05
  goal_theta_tol: 0.1
  record: true                  # OBJECT WORLD ONLY: mp4 of the simulated scene, candidates + chosen plan composited per step. Needs a MuJoCo-EXECUTING plant; `analytic` has no scene to film. Override with --no-record
  scene: clutter                # OBJECT WORLD ONLY: which SCENES key to run. The 3D scripts name their own scene and ignore this
  start: null                   # OBJECT WORLD: start/goal pose key from examples/poses/<scene>.yaml, or `random`. null = the scene's own
  goal: null
  no_plot: false             
  no_jit: false                 # true runs eager, to breakpoint inside the limit-surface dynamics. Override with --jit
  show_samples: true
  show_optimal: true
  show_contact_point: true   
