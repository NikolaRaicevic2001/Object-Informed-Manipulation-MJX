world3d:
  planning_dt: 0.05       # planner rollout timestep
  exec_timestep: 0.002    # execution model timestep
  exec_iterations: 100    # execution model solver iterations
  exec_ls_iterations: 50  # execution model line-search iterations

world2d:                  # unused for this robot
  mass: 2.0
  mu: 0.4                 # object/support friction
  mu_c: 0.5               # robot/object friction
  f_max: 4.0              # cap on the normal contact force

sampler:
  num_samples: 64
  horizon: 32
  # TEMPORARY (2026-08-14, see Tasks.md and oim/experiment.py's _run_3d):
  # lets the flat baseline (vanilla MPPI/ps/cbo/cem) use its own sample
  # budget/horizon instead of num_samples/horizon above, which ADMM also
  # reads. Flat MPPI's validated tuning (128/25) has diverged from what's
  # set for ADMM here (64/32) -- changing the shared values would move
  # ADMM's numbers too. Remove both keys (and the override in
  # experiment.py) once there is agreement to use one shared value for
  # both again -- not meant to be a permanent second knob.
  flat_num_samples: 128
  flat_horizon: 25
  robot_num_knots: 8
  robot_spline: linear
  object_spline: zero
  iterations: 1
  mppi:
    # Per-joint noise std (2026-08-16, per Shahid), replacing the single
    # scalar 0.3 for every joint -- joint order [1,2,3,4,5], matching
    # ctrl index (confirmed via actuator_trnid, not assumed from naming).
    # Motivated by a Jacobian check (see Tasks.md): joint 1 alone moves
    # the tip xy with zero tilt cost; every other joint costs the same
    # tilt per unit noise whether or not it's buying useful z-reach
    # (joints 2/3) or redundant xy motion joint 1 already gives for free
    # (joints 4/5). Round 1 (joint 1 up, joints 3+4 down, 2+5 left alone)
    # was a mistake in what Shahid meant to specify -- superseded by
    # round 2 here before round 1 was properly evaluated. Round 2: joint
    # 1 up (0.3->0.45), joints 4 and 5 down (0.3->0.2), joints 2 and 3
    # left at the original 0.3 -- see Tasks.md.
    # Shared with ADMM's robot_opt: mppi block, same as every other key
    # in this section -- not scoped to the flat baseline. Untested
    # before this round; see Tasks.md.
    # Fallback test (2026-08-16, per Shahid) tried and clearly lost:
    # every joint at uniform 0.3 except joint 2 alone at 0.45 -- zero
    # steps under goal_theta_tol across 3 runs, vs. 144 and 1038 steps
    # for the config below. See Tasks.md Phase 13c.
    noise_level: [0.45, 0.3, 0.3, 0.2, 0.2]
    temperature: 0.5
    # Flat baseline only -- read by `_run_plain`, not by ADMM's loop, so
    # inert for the object/robot ADMM blocks even though they share this
    # block. noise_anneal_* (shrink exploration noise as pos_err -> 0):
    # tested and REJECTED -- killed every success in isolation, left at
    # 0/inert. stuck_kick_* (after this many consecutive no-progress
    # control steps, perturb the sampling mean to escape a stuck
    # contact): tuned across several rounds, 150 steps/scale 0.5 is the
    # best result found -- see Tasks.md for the full sweep.
    noise_anneal_dist: 0.0
    noise_anneal_min: 0.4
    stuck_kick_steps: 150
    # 0.5 -> 2.0 (2026-08-15, per Shahid): confirmed via direct telemetry
    # (Phase 4c) that 0.5 fires but does nothing -- pos_err/theta_err
    # were bit-identical for 10+ steps after every kick during an
    # orientation-only stall (open_table, seed 0). noise_level=0.3 is the
    # normal per-step sampling std, so 2.0 (~7x that) is meant to
    # actually relocate the mean out of the neighborhood the softmax
    # keeps re-converging into, not just add a slightly-larger nudge
    # within it. Single-variable change from 4c's config -- stuck_kick_
    # steps and everything else left alone so the comparison isolates
    # this. See Tasks.md Phase 5.
    stuck_kick_scale: 2.0
    # Adaptive temperature, round 2 (2026-08-15): re-tested more
    # aggressively (eta_frac_high 0.3, temp_sharpen 0.6, temp_min 0.02)
    # against open_table, seed 0, isolated from the w_approach=40 revert below
    # by a same-day control run. Made it worse again, more so than round
    # 1: froze from step 661 for 1340/2000 steps (pos_err 0.233, theta_err
    # 0.158) vs. the w_approach=40-only control's step 1207/794 steps
    # (pos_err 0.006, theta_err 0.173 -- see "Current state" issue 1).
    # Reverted to 0.0/0.0 again. See Tasks.md.
    eta_frac_high: 0.0
    eta_frac_low: 0.0
    temp_sharpen: 0.9
    temp_widen: 1.2
    temp_min: 0.1
    temp_max: 2.5
  cem:
    num_elites: 8
    sigma_start: 0.5
    sigma_min: 0.1
  ps:
    noise_level: 0.5
  cbo:
    initial_noise_level: 0.5
    temperature: 0.5
    consensus_weight: 1.0
    noise_weight: 1.0
    step_size: 0.1
  object:
    num_samples: 256          # object block only; unset shares `num_samples`
    mppi:
      noise_level: 0.25
      temperature: 0.5

costs:
  # Pulled toward the reference IsaacGym baseline's own vanilla-MPPI
  # weights (target_to_goal=100, target_ori=8) -- see Tasks.md's
  # formulation comparison for the full reasoning.
  # x^o = object SE(2) pose, g = goal, p = xy, u = robot command,
  # w = object wrench, d = distance from the object's footprint to the
  # NEAREST obstacle, f = contact normal force [N], z_tip = tip height,
  # psi = tip tilt from straight down.
  q_pos: 200.0                  # goal position gain:     ell_o = ramp * (q_pos*||p - p_g||^2 + q_theta*ramp_th*wrap(th - th_g)^2)
  q_theta: 16.0                 # goal heading gain:      the wrap(th - th_g)^2 half of that
  qf_pos: 200.0                 # terminal position gain: ell_f = qf_pos*||p_H - p_g||^2 + qf_theta*wrap(th_H - th_g)^2
  qf_theta: 16.0                # terminal heading gain:  the wrap(th_H - th_g)^2 half of that
  # Flat baseline only. Ramps q_theta/qf_theta up to q_theta_ramp x as
  # pos_err -> 0 (over theta_ramp_dist below) -- counters position-driven
  # pushing knocking an already-converged orientation back out. 1.0 =
  # inert. Round 3 (2026-08-15, per Shahid): theta_ramp_dist back to
  # 0.15 (Phase 6's 0.10 narrowing isolated back out), q_theta_ramp kept
  # at 3.0 (Phase 6's doubling from 1.5, not reverted) -- single-variable
  # change from Phase 6, to tell whether the narrower radius or the
  # doubled ceiling was driving Phase 6's mixed/high-variance result.
  # See Tasks.md Phase 7 for the isolated test result.
  q_theta_ramp: 3.0             # near-goal heading boost: ramp_th = 1 + (q_theta_ramp - 1)*(1 - clip(||p - p_g||/theta_ramp_dist, 0, 1)); 1.0 = inert
  theta_ramp_dist: 0.15         # radius [m] of that boost

  w_effort: 0.01                # object wrench effort:  w_effort * ||w||^2
  wrench_fraction: 1.4          # object action scale:   action_scale = wrench_fraction * wrench_limit
  w_rate: [2.0, 2.0, 1.0]       # object wrench rate, per axis [fx, fy, tau]: sum_t sum_i w_rate[i] * (w[t+1,i]/limit_i - w[t,i]/limit_i)^2
  # Object-vs-obstacle proximity, exponential in clearance: cost of
  # one boundary point at zero clearance, 1/e per obstacle_decay m.
  w_obstacle: 13.5              # object-vs-obstacle proximity: w_obstacle * exp(-d/obstacle_decay), nearest obstacle only
  obstacle_decay: 0.02          # decay length [m] in that exponential

  w_robot_effort: 0.05          # robot control effort: fade * w_robot_effort * ||u||^2; pinned at 0.10-0.12/step
  # Reverted 160 -> 40 (2026-08-15, per Shahid): 160 was set directly on
  # the machine, never characterized by a documented test, and was not
  # fixing the issue it was raised for. 40 is the doubled-from-reference
  # value tested in Phase 3a (itself measured to not help and to worsen
  # the near-goal freeze) -- kept as the new baseline while a different
  # fix for that freeze is worked out. See Tasks.md.
  w_approach: 40.0              # approach: fade * w_approach * max(||p_ee - p||^2 - r0^2, 0)
  r0: 0.075                     # approach deadband radius [m]: no approach cost inside ||p_ee - p|| <= r0
  w_align: 30.0                 # stay behind the object: fade * w_align * max(cos(gamma0_deg) - cos(angle), 0), angle between (p - p_ee) and (p_ref - p)
  gamma0_deg: 30.0              # alignment cone half-angle; single_obstacle
  # does much better at 45 (measured), but 45 applied globally drops
  # open_table -- no single value serves every scene, hence the
  # `--gamma0-deg` CLI override (oim/experiment.py). Pass
  # `--gamma0-deg 45` explicitly when running single_obstacle.
  w_tilt: 100.0                 # tip tilt: w_tilt * (1 - cos(psi)) -- 0 straight down, 1 horizontal, 2 inverted. Never faded
  w_z_tip: 40.0                 # tip AT/ABOVE block mid-height: w_z_tip * (z_tip - tip_target_z)^2. Never faded
  w_z_tip_exp: 1.0              # tip BELOW mid-height: w_z_tip_exp * exp(gap_cm^2), gap_cm = 100*(tip_target_z - z_tip) -- blows up approaching a table strike
  # New (2026-08-15, per Shahid): exponential penalty on the pusher-block
  # contact's pure normal-force z-component (see PushT._contact_z_cost),
  # targeting issue 3 (tip riding the top surface) directly via contact
  # geometry instead of _tip_height_cost's height proxy. 1.0 matches
  # w_z_tip_exp's own weight -- same order-of-magnitude raw exponential
  # values at each mechanism's own typical trigger case, not yet
  # independently tuned. Untested before this run; see Tasks.md.
  w_contact_z_exp: 1.0          # top-riding: w_contact_z_exp * (exp(f10^2) - 1), f10 = clip(10*|f_z of the stick-block contact|, 0, 6)
  # 0.15 -> 0.05 (2026-08-16, per Shahid): align now stays at full
  # strength all the way down to goal_pos_tol=0.05, only fading inside
  # the tolerance band itself, instead of starting to relax at 15cm.
  # Rationale: with the old 0.15 radius, align was already partially
  # relaxed for the whole 5-15cm band -- exactly where several sessions
  # of diagnosis (issue 1) found the escape samples struggling -- which
  # may have let the pusher drift out of a good pushing angle *before*
  # reaching the point where large, awkward repositioning (tilt, tip
  # dips) became necessary to recover one. Keeping align on through that
  # whole band is a bet on prevention (never reaching the bad
  # configuration) rather than another attempt at rescuing the escape
  # after the fact (tilt dead-zone, more knots -- both tried, neither
  # helped). Approach still stays on throughout, as before. Untested
  # before this round; see Tasks.md.
  # Robot-vs-obstacle contact: w * force^2, so a hard hit costs far
  # more than a graze. Proximity is free. UNMEASURED weight.
  w_robot_contact: 1.0          # robot-vs-obstacle contact: w_robot_contact * f^2, so a hard hit costs far more than a graze. Proximity is free
  shaping_fade_dist: 0.05       # shaping fade radius [m]: fade = clip(||p - p_g||/shaping_fade_dist, 0, 1), scales approach/align/effort only; <= 0 disables it

admm:
  robot_opt: mppi
  object_opt: mppi
  n_admm: 4
  rho: 1.0
  rho_adapt: false              # residual-balancing rule; off => rho stays at `rho`
  rho_bound_factor: 8.0         # when rho_adapt: how far the rule may move rho
  gamma: 0.1
  eps_r: 0.5
  eps_s: 0.5
  noise_min: 0.0
  noise_kappa: 0.0
  noise_max: 0.0
  consensus_alpha: 1.0
  local_goal: false

run:
  seed: 5
  steps: 2000
  goal_pos_tol: 0.05
  goal_theta_tol: 0.05
  show_samples: false
  show_optimal: false
