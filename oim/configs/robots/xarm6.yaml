# xArm6 simulation config.
#
# Symbols used in the cost equations below:
#   p, th   object position / heading      p_g, th_g  goal position / heading
#   p_ee    stick tip xy                   z_tip      stick tip world height
#   u       robot joint-velocity command   w          object wrench [fx, fy, tau]
#   d       footprint-to-nearest-obstacle distance    f  robot-obstacle normal force
#   psi     stick tilt off vertical        H          horizon, in planning_dt steps
#   fade    = clip(||p - p_g|| / shaping_fade_dist, 0, 1)
#   ramp    = clip(1 + q_ramp_per_step * t/dt, 1, q_ramp_max)

# Sample projection; see docs/control_projection.md for geometry and gains.
control_projection:
  mode: qpax                  # off | qpax
  xy_weight: 100.0             # penalize changes in tip x-y velocity
  cbf_alpha: 1.0               # shared floor/slider gain [1/s]
  z_min: 0.02                  # tip heights in world metres
  z_near: 0.03
  z_far: 0.13
  distance_near: 0.02          # footprint distances after margin [m]
  distance_far: 0.15
  footprint_margin: 0.01       # [m]

world3d:
  robot_substeps: 3             # MJX steps per planning step, ROBOT rollout: contact integrates at planning_dt/robot_substeps. Costs ~robot_substeps x. Predicted/executed object travel: 1.248 at 1, 0.990 at 5
  object_substeps: 2            # MJX steps per planning step, OBJECT rollout (plant: mujoco)
  planning_dt: 0.05             # planner rollout timestep [s]
  planning_iterations: 40       # planner-model solver iterations, BOTH ADMM and flat -- they must match or a head-to-head compares two solver fidelities
  planning_ls_iterations: 30    # planner-model line-search iterations, BOTH paths
  exec_timestep: 0.002          # execution-model timestep [s]
  exec_iterations: 100          # execution-model solver iterations
  exec_ls_iterations: 50        # execution-model line-search iterations

sampler:
  num_samples: 256                            # rollouts per iteration
  horizon: 32                                 # planning horizon H, in planning_dt steps
  robot_num_knots: 8                          # spline knots over the horizon
  robot_spline: linear                        # linear | cubic | quintic
  object_spline: zero                         # zero | linear | cubic | quintic
  iterations: 1                               # optimizer passes per control step. ADMM's blocks get n_admm passes instead
  mppi:
    noise_level: [0.30, 0.2, 0.3, 0.01, 0.2]  # per-joint std, J1..J5. J1 moves the tip xy at no tilt cost so it explores widest; J4 is velocity-only, 0 freezes its mean
    temperature: 0.5                          # weight_i = softmax(-J_i / temperature)
  cem:
    num_elites: 8
    sigma_start: 0.5
    sigma_min: 0.1
  ps:
    noise_level: 0.5
  cbo:
    initial_noise_level: 0.5
    temperature: 0.5
    consensus_weight: 1.0
    noise_weight: 1.0
    step_size: 0.1
  object:                                     # object block only
    num_samples: 256                          # unset shares sampler.num_samples
    mppi:
      noise_level: 0.2
      temperature: 0.1

costs:
  # ---- Goal tracking: both blocks, same weight -------------------------
  q_pos: 200.0                  # ell_o = ramp * (q_pos*||p - p_g||^2 + q_theta*wrap(th - th_g)^2)
  q_theta: 16.0                 #   ...the wrap(th - th_g)^2 half
  qf_pos: 200.0                 # ell_f = qf_pos*||p_H - p_g||^2 + qf_theta*wrap(th_H - th_g)^2
  qf_theta: 16.0                #   ...the wrap(th_H - th_g)^2 half
  q_ramp_per_step: 0.005        # ramp = clip(1 + q_ramp_per_step * t/dt, 1, q_ramp_max); t read once per rollout, so constant across a horizon
  q_ramp_max: 30.0              # cap on that ramp

  # ---- Obstacle: margin-gated barrier ---------------------------------
  # cost = w_obstacle * (exp(min((gap/obstacle_decay)^2, 10)) - 1), gap = clip(obstacle_margin - d, 0, inf)      -- zero past the margin
  w_obstacle: 1000.0            # weight at the margin boundary
  obstacle_decay: 0.02          # barrier steepness inside the margin [m]
  obstacle_margin: 0.03         # stand-off before the penalty engages [m]

  # ---- Support: table-edge keep-in ------------------------------------
  w_support: 500.0              # cost = w_support * sum_footprint clip(d_edge + support_margin, 0, inf)^2
  support_margin: 0.2           # how far inside the rim it starts [m]

  # ---- Object effort: object block ------------------------------------
  w_effort: 0.01                      # cost = w_effort * ||w / wrench_limit||^2
  w_effort_normalized: 1.0            # 1 = normalize by wrench_limit; 0 = raw N / N.m (torque then priced ~1e-3 of force)
  w_rate: [8.0, 8.0, 2.0]             # cost = sum_t sum_i w_rate[i] * (w[t+1,i] - w[t,i])^2 / limit_i^2
  robot_block_support: 0.0            # 1 = ADMM robot block also charges the table-edge keep-in (real runs 1.0)
  w_contact_rate: [8.0, 8.0, 1.0]     # same form on [px, py, lambda], consensus=contact_point only. Prices the ARM's cost of relocating a contact, which the object block can teleport for free

  # ---- Robot effort ---------------------------------------------------
  w_robot_effort: 0.05          # cost = fade * w_robot_effort * ||u||^2

  # ---- Approach: pull the tip to the pushing ring ---------------------
  # cost = fade * w_approach * max(sdf_xy(tip in block frame) - r0, 0)^2
  w_approach: 60.0              # weight [cost per m^2]; real runs 6000 on its own scale
  r0: 0.015                     # stand-off from the wall [m]

  # ---- Align: stay behind the object ----------------------------------
  w_align: 50.0                 # cost = fade * w_align * max(cos(gamma0_deg) - cos(angle), 0), angle between (p - p_ee) and (p_ref - p)
  gamma0_deg: 60.0              # half-angle of the free cone [deg]
  align_ref: plan_end           # p_ref: plan_end = the object block's plan endpoint | goal = the global goal (what the flat path always uses)

  # ---- Tip posture: tilt and height -----------------------------------
  w_tilt: 80.0                  # cost = fade * w_tilt * (1 - cos(psi)); 0 down, 1 horizontal, 2 inverted
  tip_z_form: piecewise         # piecewise = quadratic at/above mid-height, exponential below | symmetric_exp (real)
  w_z_tip: 1.0                  # at/above mid-height: fade * w_z_tip * (100*(z_tip - z_mid))^2, per cm^2
  w_z_tip_exp: 1.0              # below it: w_z_tip_exp * exp((100*(z_mid - z_tip))^2). Never faded -- a table strike is dangerous, not merely costly

  # ---- Top-riding barrier ---------------------------------------------
  w_contact_z_exp: 200.0        # cost = w * exp((2*(1 - clip(|dz|/contact_z_slab, 0, 1)))^2), dz = z_tip - top face, inside the inflated footprint only. Never faded; peak w*e^4 = 10920
  contact_z_slab: 0.015         # half-thickness of that band [m]; sets reach and steepness together
  contact_z_margin: 0.008       # outward inflation of its footprint test: sdf(xy) <= margin. ~one stick radius, so a tip on the top EDGE still counts as inside

  # ---- Robot-obstacle clearance and fade ------------------------------
  w_robot_contact: 0.1          # reactive: w_robot_contact * f^2, so a hard hit costs far more than a graze. Proximity is free. UNMEASURED
  pusher_obstacle_weight: 0.0   # preventive: w * w_obstacle * (pusher_obstacle_margin - d)^2; 0 = off (real runs 300.0)
  pusher_obstacle_margin: 0.06  # clearance the tip keeps from an obstacle wall [m]
  shaping_fade_dist: 0.25       # fade = clip(||p - p_g|| / shaping_fade_dist, 0, 1)
                                #   FADED: w_approach, w_align, w_tilt, w_robot_effort, w_z_tip, ADMM consensus penalty
                                #   NOT FADED: w_z_tip_exp, w_contact_z_exp, w_robot_contact, pusher-obstacle, and every goal/object term

admm:
  plant: mujoco                 # object block dynamics: mujoco = MJX on a stripped scene | analytic = eq. 5 limit surface
  friction: box                 # object-world contact: box (only one that converges on every scene) | cone | wrench
  robot_opt: mppi               # mppi | cem | ps | cbo
  object_opt: mppi              # mppi | cem | ps | cbo
  wrench_fraction: 1.5          # object action box = wrench_fraction * wrench_limit
  contact_fraction: 2.5         # lambda ceiling, consensus=contact_point: f_max = contact_fraction * mu*m*g
  consensus: object_pose        # object_pose = [x, y, yaw] (yaw wrapped in every ADMM subtraction) | wrench = [fx, fy, tau], paper eq. 24 | contact_point = [px, py, lambda]
  n_admm: 4                     # ADMM rounds per control step
  lagged_consensus: "off"       # off = Algorithm 4: each block re-simulates its own outgoing mean (37% of a solve). robot|both carry the INCOMING mean as a free extra sample row, so z and the duals at round l use A(x_{l-1}) -- 871 -> 660 ms, but NOT Algorithm 4, so runs are not comparable across it
  rho: 2.0                      # consensus penalty, force/position channels; rho_init = [rho, rho, rho_torque]
  rho_torque: 2.0               # ...the torque/yaw channel
  max_dual_factor: 2.0          # dual anti-windup: |y_i| <= max_dual_factor * scale_i, per channel. Bounds the MULTIPLIER, not the wrench -- the wrench's bound is the friction cone
  gamma: 0.1                    # proximal weight: (gamma/2) * ||U - U_prev||^2
  consensus_object_weight: 0.8  # z <- w_o*(A^o + y_o) + (1 - w_o)*(A^r + y_r). 0.5 = eq. 27's average; >0.5 tilts z toward the object block's cleaner 3-DOF plan
  eps_r: 0.05                   # early exit: stop once primal_res <= eps_r
  eps_s: 0.05                   # ...and dual_res <= eps_s

run:
  seed: 0                       # sampler seed
  steps: 1000                   # control-step budget per run
  goal_pos_tol: 0.05            # success: position error below this [m]
  goal_theta_tol: 0.1           # ...and heading error below this [rad]
  record: false                 # mp4 of the scene, candidates + chosen plan per step. Needs a MuJoCo-executing plant
  warp: true                    # MuJoCo Warp rollouts; also disables JAX GPU preallocation, which Warp needs
  headless: true                # no viewer: run `steps` steps and save a run file
  scene: clutter                # which SCENES key to run
  object: scene                 # what is pushed: scene (the MJCF's own) | banana | power_drill | sugar_box | tomato_soup
  start: null                   # start pose key
  goal: null                    # goal pose key
  no_plot: true                 # skip plots
  no_jit: false                 # true runs eager, to breakpoint inside the dynamics
  show_samples: true            # draw sampled rollouts
  show_optimal: true            # draw the nominal plan
  show_contact_point: true      # draw the consensus contact point
