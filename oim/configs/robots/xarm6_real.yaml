# xArm6 real-robot config (open_table_real / single_obstacle_real /
# box_clutter_real / live_real).
#
# Same algorithm and same key structure as xarm6.yaml -- only weights,
# budgets and the hardware-only keys differ. Symbols:
#   p, th   object position / heading      p_g, th_g  goal position / heading
#   p_ee    stick tip xy                   z_tip      stick tip world height
#   u       robot joint-velocity command   w          object wrench [fx, fy, tau]
#   d       footprint-to-nearest-obstacle distance    f  robot-obstacle normal force
#   psi     stick tilt off vertical        H          horizon, in planning_dt steps
#   fade    = clip(||p - p_g|| / shaping_fade_dist, 0, 1)
#   ramp    = clip(1 + q_ramp_per_step * t/dt, 1, q_ramp_max)

world3d:
  robot_substeps: 3             # MJX steps per planning step, ROBOT rollout
  object_substeps: 2            # MJX steps per planning step, OBJECT rollout (plant: mujoco)
  planning_dt: 0.05             # planner rollout timestep [s]; the plan is resampled to the driver's control rate
  planning_iterations: 40       # planner-model solver iterations, BOTH ADMM and flat. Matches xarm6.yaml -- unset, this fell back to the MJCF's 20 while sim ran 40
  planning_ls_iterations: 30    # planner-model line-search iterations, BOTH paths
  exec_timestep: 0.002          # execution-model (mock / viewer) timestep [s]
  exec_iterations: 100          # execution-model solver iterations
  exec_ls_iterations: 50        # execution-model line-search iterations

sampler:
  num_samples: 128              # robot rollouts per solve (GPU-bound: ~265 ms on the 2080 Ti)
  horizon: 32                   # planning horizon H, in planning_dt steps
  robot_num_knots: 8            # spline knots over the horizon
  robot_spline: linear          # interpolation between robot knots
  object_spline: zero           # zero-order hold on the object block's wrench knots
  iterations: 1                 # optimizer passes per control step
  mppi:                                       # flat MPPI robot sampler (--algorithm mppi)
    noise_level: [0.45, 0.15, 0.15, 0, 0.2]   # per-joint velocity std [rad/s], J1..J5 (J4 off)
    temperature: 100                          # weight_i = softmax(-J_i / temperature), raw cost units
    stuck_kick_steps: 0                       # solves with no progress before a random kick; 0 = off
    stuck_kick_scale: 0.15                    # kick std [rad/s]
  admm_robot:                   # ADMM robot block sampler; same keys as mppi, absent = shared sampler.*
    horizon: 28                 # ADMM's own horizon (tuned with mask window 18, latency 0.27)
    mppi:
      noise_level: [0.38, 0.125, 0.125, 0, 0.17]
      temperature: 50
      stuck_kick_steps: 0
      stuck_kick_scale: 0.15
  cem:                          # alternative robot samplers (--robot-opt), not used for paper runs
    num_elites: 8
    sigma_start: 0.5
    sigma_min: 0.1
  ps:
    noise_level: 0.5
  cbo:
    initial_noise_level: 0.5
    temperature: 0.5
    consensus_weight: 1.0
    noise_weight: 1.0
    step_size: 0.1
  object:                       # ADMM object block sampler
    num_samples: 256            # object rollouts per solve, cheap
    mppi:
      noise_level: 0.25         # wrench-action std, in wrench-limit units
      temperature: 5            # its costs are ~100x smaller than the robot's

costs:                          # one cost set, read by every algorithm -- no ADMM overlay
  # ---- Goal tracking: both blocks, same weight -------------------------
  q_pos: 200.0                  # ell_o = ramp * (q_pos*||p - p_g||^2 + q_theta*wrap(th - th_g)^2)
  q_theta: 15.0                 #   ...the wrap(th - th_g)^2 half
  qf_pos: 100.0                 # ell_f = qf_pos*||p_H - p_g||^2 + qf_theta*wrap(th_H - th_g)^2
  qf_theta: 45.0                #   ...the wrap(th_H - th_g)^2 half
  q_ramp_per_step: 0.025        # ramp = clip(1 + q_ramp_per_step * t/dt, 1, q_ramp_max)
  q_ramp_max: 200.0             # cap on that ramp

  # ---- Obstacle: margin-gated barrier ---------------------------------
  # cost = w_obstacle * (exp(min((gap/obstacle_decay)^2, 10)) - 1),
  #        gap = clip(obstacle_margin - d, 0, inf)      -- zero past the margin
  w_obstacle: 3000.0            # weight at the margin boundary
  obstacle_decay: 0.02          # barrier steepness inside the margin [m]
  obstacle_margin: 0.03         # stand-off before the penalty engages [m]

  # ---- Support: table-edge keep-in ------------------------------------
  w_support: 10000.0            # cost = w_support * sum_footprint clip(d_edge + support_margin, 0, inf)^2
  support_margin: 0.10          # how far inside the modeled rim it starts [m]

  # ---- Object effort: object block ------------------------------------
  w_effort: 0.01                      # cost = w_effort * ||w / wrench_limit||^2
  w_effort_normalized: 1.0            # 1 = normalize by wrench_limit; 0 = raw N / N.m
  w_rate: [2.0, 2.0, 1.0]             # cost = sum_t sum_i w_rate[i] * (w[t+1,i] - w[t,i])^2 / limit_i^2
  robot_block_support: 1.0            # 1 = ADMM robot block also charges the table-edge keep-in (sim: 0)
  w_contact_rate: [8.0, 8.0, 1.0]     # same form on [px, py, lambda], consensus=contact_point only

  # ---- Robot effort ---------------------------------------------------
  w_robot_effort: 0.05          # cost = fade * w_robot_effort * ||u||^2

  # ---- Approach: pull the tip to the pushing ring ---------------------
  # cost = fade * w_approach * max(sdf_xy(tip in block frame) - r0, 0)^2
  # Exactly 0 over the footprint; minimal on the ring around the walls, so
  # r0 is a stand-off FROM THE WALL. Purely xy.
  w_approach: 6000.0            # weight [cost per m^2]
  r0: 0.015                     # stand-off from the wall [m]

  # ---- Align: stay behind the object ----------------------------------
  w_align: 250.0                # cost = fade * w_align * max(cos(gamma0_deg) - cos(angle), 0), angle between (p - p_ee) and (p_ref - p)
  gamma0_deg: 20.0              # half-angle of the free cone [deg]
  align_ref: plan_end           # p_ref: plan_end = the object block's plan endpoint | goal = the global goal
  #wia_ref_alpha: 0.85          # cross-solve EMA of that reference; unset = 0 = off

  # ---- Tip posture: tilt and height -----------------------------------
  w_tilt: 1500.0                # cost = fade * w_tilt * (1 - cos(psi)); ceiling = w_tilt
  tip_z_form: symmetric_exp     # symmetric_exp = exponential both sides of mid-height | piecewise (sim)
  w_z_tip: 0.0008               # at/above mid-height, per cm^2. Inert under symmetric_exp; declared so the key set matches sim
  w_z_tip_exp: 5.0              # cost = w * exp(min((100*(z_tip - z_mid))^2, 10)), both directions

  # ---- Top-riding barrier ---------------------------------------------
  w_contact_z_exp: 0.0          # cost = w * exp((2*(1 - clip(|dz|/contact_z_slab, 0, 1)))^2); 0 = off (sim runs 200.0)
  contact_z_slab: 0.01          # half-thickness of that band [m]; inert while the weight is 0
  contact_z_margin: 0.0         # outward inflation of its footprint test [m]; inert while the weight is 0

  # ---- Robot-obstacle clearance and fade ------------------------------
  w_robot_contact: 0.1          # reactive: w_robot_contact * f^2, zero until contact happens
  pusher_obstacle_weight: 300.0 # preventive: w * w_obstacle * (pusher_obstacle_margin - d)^2; 0 = off (sim runs 0.0)
  pusher_obstacle_margin: 0.03  # clearance the tip keeps from an obstacle wall [m]
  shaping_fade_dist: 0.05       # fade = clip(||p - p_g|| / shaping_fade_dist, 0, 1)

admm:
  plant: mujoco                 # object block dynamics: mujoco = MJX on a stripped scene | analytic = eq. 5 limit surface
  friction: box                 # object-world contact: box | cone | wrench
  robot_opt: mppi               # mppi | cem | ps | cbo
  object_opt: mppi              # mppi | cem | ps | cbo
  wrench_fraction: 1.5          # object action box = wrench_fraction * wrench_limit
  contact_fraction: null        # lambda ceiling, consensus=contact_point: f_max = contact_fraction * mu*m*g. null = PushT's fallback
  consensus: object_pose        # object_pose = [x, y, yaw] | wrench = [fx, fy, tau], paper eq. 24 | contact_point = [px, py, lambda]
  n_admm: 2                     # ADMM rounds per control step
  lagged_consensus: "off"       # off = Algorithm 4 (every hardware run so far) | robot | both
  rho: 2.0                      # consensus penalty, position channels; rho_init = [rho, rho, rho_torque]
  rho_torque: 2.0               # ...the yaw channel
  max_dual_factor: 2.0          # dual anti-windup: |y_i| <= max_dual_factor * scale_i, per channel. Was 0.5, tuned for WRENCH consensus (duals railed at 2.0*scale for 70-90% of a run); does not carry to a pose scale in m and rad
  gamma: 0.5                    # proximal weight: (gamma/2) * ||U - U_prev||^2
  consensus_object_weight: 0.8  # z <- w_o*(A^o + y_o) + (1 - w_o)*(A^r + y_r). Unified onto sim's 0.8; 0.5 = eq. 27's average
  eps_r: 0.05                   # early exit: stop once primal_res <= eps_r
  eps_s: 0.05                   # ...and dual_res <= eps_s

run:
  seed: 5                       # sampler seed
  steps: 1500                   # control-step budget per run
  vel_limit: 0.3               # HARDWARE: joint-velocity command cap [rad/s], EVERY algorithm. Caps the published command and the planner's sample bounds together
  latency_comp: 0.27            # HARDWARE: solve-to-execution latency the planner predicts across [s]; EMA-tracked, 0 = off
  print_every: 10               # console step summary every N control steps, 0 = none; the run file always holds every step
  goal_pos_tol: 0.05            # success: position error below this [m]
  goal_theta_tol: 0.1           # ...and heading error below this [rad]
  warp: true                    # MuJoCo Warp rollout backend
  headless: false               # no viewer
  show_samples: false           # draw sampled rollouts
  show_optimal: false           # draw the nominal plan
