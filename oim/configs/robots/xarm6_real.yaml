# xArm6 real-robot config (open_table_real / single_obstacle_real /
# box_clutter_real / live_real). Units: metres, radians, seconds, newtons
# unless a key says otherwise.
#
# Layout: `costs:` is the flat MPPI set; `costs_admm:` overlays it for
# --algorithm admm (a key present there wins). `--cost KEY=VAL` on the
# command line overrides both. `sampler.mppi` is the flat robot sampler,
# `sampler.admm_robot.mppi` the ADMM robot block's, `sampler.object` the
# ADMM object block's.

world3d:
  planning_dt: 0.05             # rollout step [s]; the plan is resampled to the driver's control rate
  robot_substeps: 3             # MJX physics substeps per planning step in the robot block
  exec_timestep: 0.002          # execution-model (mock / viewer) physics step [s]
  exec_iterations: 100          # execution-model solver iterations
  exec_ls_iterations: 50        # execution-model line-search iterations

sampler:
  num_samples: 128              # robot rollouts per solve (GPU-bound: ~265 ms on the 2080 Ti)
  horizon: 42                   # planning horizon H in planning_dt steps, every algorithm (28 x 0.05 = 1.4 s)
  robot_num_knots: 8            # spline knots over the horizon for the robot controls
  robot_spline: linear          # interpolation between robot knots
  object_spline: zero           # zero-order hold for the object block's wrench knots
  iterations: 1                 # optimizer passes per control step

  # Flat MPPI robot sampler (--algorithm mppi).
  mppi:
    noise_level: [0.45, 0.15, 0.15, 0, 0.2]   # per-joint velocity noise std [rad/s], J1..J5 (J4 off: no wrist-tilt exploration)
    temperature: 100            # softmax temperature in raw cost units
    stuck_kick_steps: 0         # solves with no block/tip progress before a random kick of the nominal; 0 = off
    stuck_kick_scale: 0.15      # kick perturbation std [rad/s]

  # ADMM robot block sampler (--algorithm admm); same keys as `mppi`.
  admm_robot:
    mppi:
      noise_level: [0.38, 0.125, 0.125, 0, 0.17]
      temperature: 50
      stuck_kick_steps: 0
      stuck_kick_scale: 0.15

  # ADMM object block sampler.
  object:
    num_samples: 256            # object (quasi-static plant) rollouts per solve, cheap
    mppi:
      noise_level: 0.25         # wrench-action noise std, in wrench-limit units
      temperature: 5            # object block softmax temperature (its costs are ~100x smaller than the robot's)

  # Alternative robot samplers (--robot-opt), not used for the paper runs.
  cem:
    num_elites: 8
    sigma_start: 0.5
    sigma_min: 0.1
  ps:
    noise_level: 0.5
  cbo:
    initial_noise_level: 0.5
    temperature: 0.5
    consensus_weight: 1.0
    noise_weight: 1.0
    step_size: 0.1

# Flat MPPI cost set. Also the base every ADMM key falls back to.
costs:
  # --- goal tracking (object pose vs goal) ---
  q_pos: 200.0                  # running position gain: q_pos * ||p - p_goal||^2
  q_theta: 10.0                 # running heading gain: q_theta * wrap(th - th_goal)^2
  qf_pos: 200.0                 # terminal position gain
  qf_theta: 45.0                # terminal heading gain
  q_ramp_per_step: 0.022        # goal gains grow by this per executed control step (ramp = 1 + per_step * step)
  q_ramp_max: 200.0             # cap on that ramp

  # --- object block: wrench effort and obstacle/table-edge clearance ---
  w_effort: 0.01                # object block: penalty on the planned wrench magnitude
  w_rate: [2.0, 2.0, 1.0]       # object block: penalty on wrench change between steps, per channel [fx, fy, tau]
  w_obstacle: 3000.0            # object-vs-obstacle proximity: w * exp(-d / obstacle_decay), nearest obstacle
  obstacle_decay: 0.02          # decay length of that exponential [m]
  w_support: 10000.0             # table-edge keep-in: quadratic on footprint points closer than support_margin to the edge
  support_margin: 0.10          # keep-in margin from the modeled table edge [m]

  # --- robot block: effort ---
  w_robot_effort: 0.05          # penalty on the joint-velocity command squared (faded near the goal)

  # --- approach: pull the tip to where it should push ---
  # approach_mode is the sole selector -- no other key changes which
  # form runs (fixed 2026-09-07). 1 here to try the SDF-wall-distance
  # form against checkpoint 2's retuned weights; 0 = origin/r0 form is
  # the default this falls back to if this line is removed.
  approach_mode: 1               # 0 = distance to block origin, 1 = distance to nearest wall (SDF), 2 = wrench-informed landing point (ADMM path only)
  approach_z: 1.0               # mode 1: fold the tip-height error into the approach distance outside the footprint
  w_approach: 1200.0            # approach weight [cost per m] (linear in distance with approach_power 1)
  approach_power: 1.0           # 1 = linear pull per cm, 2 = quadratic
  r0: 0.015                     # stand-off from the wall where the pull stops [m] (mode 2: baked into the landing point)

  # --- align: keep the tip behind the block relative to where it must go ---
  w_align: 150.0                # weight on max(cos(gamma0) - cos(angle), 0)
  gamma0_deg: 20.0              # half-angle of the free cone behind the block [deg]
  align_theta_gain: 0.5         # metres of position error one radian of heading error is worth in the reference direction
  align_top_suppress: 0.0       # 1 = switch align off while the tip is over the block top

  # --- tip posture: tilt and height ---
  w_tilt: 1200.0                # stick tilt penalty: w * (1 - cos(tilt)), ceiling = w
  w_z_tip: 25.0                 # quadratic pull of the tip height toward the contact height (per cm^2)
  tip_quadratic_target_z: 0.025 # target tip height for that pull [m] (block mid-height)
  tip_floor_z: 0.012            # below this height the table-strike barrier starts [m]
  w_z_tip_exp: 1.0              # table-strike barrier weight: w * (exp((gap / scale)^2) - 1)

  # --- contact-z: keep the tip off the block's top face ---
  w_contact_z_exp: 500.0        # barrier weight inside the slab straddling the top face
  contact_z_slab: 0.015         # slab thickness below the top face [m]; 0.01 left contacts 10-15 mm under the edge free, and those rode up (09-06)
  contact_z_slab_above: 0.06    # slab thickness above the top face [m]; 0.03 let hops over the block at 6-9 mm clearance through (09-06 top strikes)
  contact_z_below_mult: 5.0     # pressing into the face costs this many times hovering above it
  contact_z_cap: 30000.0        # ceiling on the barrier (float32 safety)
  contact_z_margin: 0.02        # footprint inflation for the slab test [m]
  contact_z_mask: 0             # 1 = also disqualify samples entering the band (first 12 rollout steps); 0 = off

  # --- robot-obstacle contact and fading ---
  w_robot_contact: 0.1          # penalty on robot-vs-obstacle contact force squared
  pusher_obstacle_weight: 300.0 # tip-vs-obstacle clearance hinge: weight * w_obstacle * (margin - d)^2 per obstacle (incl. the base circle); 0 = off
  pusher_obstacle_margin: 0.03  # clearance the tip keeps from an obstacle wall [m]; also the room a landing face needs before mode 2 will target it
  w_contact_rate: [8.0, 8.0, 1.0]   # consensus-space rate penalty per channel (contact_point consensus only)
  shaping_fade_dist: 0.05       # approach/align/tilt/effort fade linearly to 0 inside this distance to the goal [m]

# ADMM overlay (--algorithm admm). Keys here replace the same keys in `costs:`.
costs_admm:
  # --- goal tracking ---
  q_pos: 400.0
  q_theta: 20.0
  q_ramp_per_step: 0.023
  q_ramp_max: 200.0
  theta_slack_max: 0.3          # heading error forgiven far from the goal [rad]; 0 = no slack
  theta_slack_far_dist: 0.15    # full slack beyond this distance to the goal [m]
  theta_slack_near_dist: 0.0    # slack shrinks linearly to 0 at this distance [m]

  # --- approach (wrench-informed landing point + routing) ---
  approach_mode: 2
  approach_z: 1.0
  w_approach: 4000.0
  approach_power: 1.0
  r0: 0.01
  wia_min_margin: 0.01
  wia_ref_alpha: 0.7            # cross-solve EMA of the object plan endpoint the landing point is computed from; 0 = off
  approach_route_margin: 0.025

  # --- align ---
  w_align: 150.0
  align_theta_gain: 0.5
  align_top_suppress: 0.0

  # --- tip posture ---
  w_tilt: 4000.0
  w_z_tip: 25.0
  tip_quadratic_target_z: 0.025

  # --- contact-z ---
  w_contact_z_exp: 500.0
  contact_z_slab: 0.015
  contact_z_slab_above: 0.06
  contact_z_below_mult: 5.0
  contact_z_cap: 30000.0
  contact_z_margin: 0.02
  contact_z_mask: 1.0

  # --- fading ---
  shaping_fade_dist: 0.0        # off: mode-2 approach/align stay well defined at the goal, and the fade also switched the consensus penalty off inside 5 cm (09-06 endgame flail)

admm:
  plant: analytic               # object block dynamics: analytic quasi-static limit surface (or mujoco)
  n_admm: 2                     # ADMM iterations per control step
  consensus: wrench             # consensus variable: the object wrench (or contact_point / object_pose)
  consensus_source: twist_exact # how the robot's realized wrench A^r is read from its rollout (twist / twist_exact / contact)
  twist_stick_speed: 0.005      # block speed below which A^r is treated as zero (sticking) [m/s]
  object_substeps: 5            # object plant substeps per planning step
  wrench_fraction: 1.5          # object action box = wrench_fraction * wrench limit
  robot_opt: mppi               # robot block optimizer
  object_opt: mppi              # object block optimizer
  rho: 30                       # consensus penalty weight, force channels (robot block)
  rho_torque: 30                # consensus penalty weight, torque channel (robot block)
  rho_object: 1                 # consensus penalty weight seen by the object block (its costs are ~100x smaller)
  rho_adapt: false              # residual-balancing rho adaptation
  rho_bound_factor: 8.0         # when rho_adapt: how far the rule may move rho
  gamma: 0.5                    # proximal weight tying each block's plan to its previous one
  vel_limit: 0.25               # joint-velocity command limit for ADMM runs [rad/s]
  eps_r: 0.05                   # primal residual tolerance
  eps_s: 0.05                   # dual residual tolerance
  local_goal: false             # robot block tracks the object plan endpoint instead of the global goal

run:
  seed: 5                       # sampler seed
  steps: 1500                   # control-step budget per run
  vel_limit: 0.21                # joint-velocity command limit for MPPI runs [rad/s]
  latency_comp: 0.27            # initial solve-to-execution latency the planner predicts across [s]; tracked by EMA; 0 = off
  goal_pos_tol: 0.05            # success: position error below this [m] ...
  goal_theta_tol: 0.1           # ... and heading error below this [rad]
  warp: true                    # MuJoCo Warp rollout backend
  headless: false               # no viewer
  show_samples: false           # draw sampled rollouts in the viewer
  show_optimal: false           # draw the nominal plan in the viewer
