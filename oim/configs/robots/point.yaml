world3d:
  planning_dt: 0.05           # sub-optimizer rollout timestep
  robot_substeps: 5           # MJX physics steps per planning step in the ROBOT rollout, so it integrates contact at planning_dt/5 = 0.01s while the horizon keeps its 24 steps. Costs 5x in the robot rollout. Measured against the execution model on 100 logged states: the object travel the planner predicts is 0.723x the executed travel at 1 substep, 0.978x at 5, 1.000x at 10; per-step disagreement 3.44mm -> 0.38mm -> 0.16mm
  exec_timestep: 0.002        # execution-model MuJoCo timestep
  exec_iterations: 100        # number of iterations for the execution model
  exec_ls_iterations: 50      # number of iterations for the local search

world2d:
  mass: 2.0
  mu: 0.4                     # object/support friction
  mu_c: 0.5                   # robot/object friction
  f_max: 4.0                  # cap on the normal contact force

sampler:
  num_samples: 128            # number of samples for the sampler
  horizon: 24                 # consensus horizon H, in steps of planning_dt
  robot_num_knots: 6          # number of knots for the robot spline
  robot_spline: linear        # robot spline type: linear | cubic | quintic
  object_spline: zero         # object spline type: zero | linear | cubic | quintic
  iterations: 1               # flat baselines only
  mppi:                       # MPPI optimizer parameters
    noise_level: 0.3
    temperature: 0.5          # temperature for the MPPI optimizer: higher temperature -> more exploration (0.0: greedy, 1.0: random)
  cem:                        # CEM optimizer parameters
    num_elites: 8
    sigma_start: 0.5
    sigma_min: 0.1
  ps:                         # PS optimizer parameters
    noise_level: 0.5
  cbo:                        # CBO optimizer parameters
    initial_noise_level: 0.5
    temperature: 0.5
    consensus_weight: 1.0
    noise_weight: 1.0
    step_size: 0.1
  object:                     # Object optimizer parameters
    num_samples: 256          # object block only; unset shares `num_samples`
    mppi:
      noise_level: 0.30       # noise level for the MPPI optimizer  
      temperature: 0.5        # temperature for the MPPI optimizer

costs:
  # x^o = object SE(2) pose, g = goal, p = xy, u = robot command,
  # w = object wrench, d = distance from the object's footprint to the
  # NEAREST obstacle, f = robot-vs-obstacle contact normal force [N].

  # Shared costs -- read by BOTH subproblems, at the same weight
  q_pos: 200.0                  # goal position gain:    ell_o = ramp * (q_pos*||p - p_g||^2 + q_theta*wrap(th - th_g)^2)
  q_theta: 5.0                  # goal heading gain:     same formula, the wrap(th - th_g)^2 half
  qf_pos: 200.0                 # terminal position gain: ell_f = qf_pos*||p_H - p_g||^2 + qf_theta*wrap(th_H - th_g)^2
  qf_theta: 5.0                 # terminal heading gain:  same formula, the wrap(th_H - th_g)^2 half
  q_ramp_per_step: 0.005        # goal-tracking ramp, BOTH blocks, on the goal terms only: ramp = clip(1 + q_ramp_per_step * t/dt, 1, q_ramp_max), t read once per horizon
  q_ramp_max: 10.0              # cap on that ramp
  w_obstacle: 20.0              # object-vs-obstacle proximity: w_obstacle * exp(-d/obstacle_decay), nearest obstacle only
  obstacle_decay: 0.02          # decay length [m] in that exponential: halves the penalty every obstacle_decay*ln2 of clearance
  w_support: 200.0              # object-vs-TABLE-EDGE, a keep-IN region: w_support * sum over footprint of clip(d + support_margin, 0, inf)^2
  support_margin: 0.2           # how far inside the rim [m] it starts; 0 until then

  # Object costs -- object subproblem only.
  wrench_fraction: 1.0          # NOT a cost: object action scale, action_scale = wrench_fraction * wrench_limit
  w_effort: 0.01                # object wrench effort: w_effort * ||w||^2
  w_rate: [2.0, 2.0, 1.0]       # object wrench rate, per axis [fx, fy, tau]: sum_t sum_i w_rate[i] * (w[t+1,i]/limit_i - w[t,i]/limit_i)^2

  # Pusher costs -- robot subproblem only.
  w_robot_effort: 0.05          # robot control effort: fade * w_robot_effort * ||u||^2
  w_approach: 20.0              # approach: fade * w_approach * max(||p_ee - p||^2 - r0^2, 0), pulls the tip onto the object
  r0: 0.05                      # approach deadband radius [m]: no approach cost inside ||p_ee - p|| <= r0; < block half-width so it never goes slack
  w_align: 15.0                 # stay behind the object: fade * w_align * max(cos(gamma0_deg) - cos(angle), 0), angle between (p - p_ee) and (p_ref - p)
  gamma0_deg: 50.0              # alignment cone half-angle [deg] in that hinge: zero cost while the tip is within gamma0_deg of the push direction
  w_robot_contact: 0.1          # robot-vs-obstacle contact: w_robot_contact * f^2, so a hard hit costs far more than a graze. Proximity is free. UNMEASURED weight.
  shaping_fade_dist: 0.20       # shaping fade radius [m]: fade = clip(||p - p_g||/shaping_fade_dist, 0, 1), scales approach/align AND the ADMM consensus penalty

admm:
  robot_opt: mppi               # robot optimizer: mppi | cem | ps | cbo
  object_opt: mppi              # object optimizer: mppi | cem | ps | cbo
  n_admm: 4
  rho: 0.0                      # ADMM step size
  rho_torque: 0.0               # ADMM step size for torque
  rho_adapt: false              # residual-balancing rule; off => rho stays at `rho`
  rho_bound_factor: 8.0         # when rho_adapt: how far the rule may move rho
  gamma: 0.1                    # ADMM dual variable scaling: gamma = gamma_max * gamma_min^(t/T), gamma_max = 1.0, gamma_min = 0.01
  eps_r: 0.5                    # ADMM primal residual tolerance: eps_r = eps_r_max * eps_r_min^(t/T), eps_r_max = 0.5, eps_r_min = 0.01
  eps_s: 0.5                    # ADMM dual residual tolerance: eps_s = eps_s_max * eps_s_min^(t/T), eps_s_max = 0.5, eps_s_min = 0.01
  noise_min: 0.0                # ADMM noise minimum: noise_min = noise_min_max * noise_min_min^(t/T), noise_min_max = 0.0, noise_min_min = 0.01
  noise_kappa: 0.0              # ADMM noise kappa: noise_kappa = noise_kappa_max * noise_kappa_min^(t/T), noise_kappa_max = 0.0, noise_kappa_min = 0.01
  noise_max: 0.0                # ADMM noise maximum: noise_max = noise_max_max * noise_max_min^(t/T), noise_max_max = 0.0, noise_max_min = 0.01
  consensus_alpha: 1.0          # consensus weight: alpha = consensus_alpha * alpha_max, alpha_max = 1.0
  local_goal: true              # robot block tracks the object block's own PLAN instead of the global goal, in ell_o and the terminal term only; snaps back to the global goal inside shaping_fade_dist
  local_goal_lookahead: 0.10    # how tightly it follows that plan: aim at the first planned pose >= this far [m] from the object, re-picked every rollout step so the carrot slides along the route. 0 = aim at the plan's endpoint only (the old behaviour)

run:
  seed: 5
  steps: 1000
  goal_pos_tol: 0.05
  goal_theta_tol: 0.1
  show_samples: true
  show_optimal: true
