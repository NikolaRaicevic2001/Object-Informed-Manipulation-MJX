world3d:
  planning_dt: 0.05           # sub-optimizer rollout timestep
  exec_timestep: 0.002        # execution-model MuJoCo timestep
  exec_iterations: 100        # number of iterations for the execution model
  exec_ls_iterations: 50      # number of iterations for the local search

world2d:
  mass: 2.0
  mu: 0.4                     # object/support friction
  mu_c: 0.5                   # robot/object friction
  f_max: 4.0                  # cap on the normal contact force

sampler:
  num_samples: 128            # number of samples for the sampler
  horizon: 24                 # consensus horizon H, in steps of planning_dt
  robot_num_knots: 4          # number of knots for the robot spline
  robot_spline: linear        # robot spline type: linear | cubic | quintic
  object_spline: zero         # object spline type: zero | linear | cubic | quintic
  iterations: 1               # flat baselines only
  mppi:
    noise_level: 0.214
    temperature: 0.5
  cem:
    num_elites: 8
    sigma_start: 0.5
    sigma_min: 0.1
  ps:
    noise_level: 0.5
  cbo:
    initial_noise_level: 0.5
    temperature: 0.5
    consensus_weight: 1.0
    noise_weight: 1.0
    step_size: 0.1
  object:
    num_samples: 256          # object block only; unset shares `num_samples`
    mppi:
      noise_level: 0.25
      temperature: 0.5

costs:
  q_pos: 200.0
  q_theta: 5.0
  qf_pos: 200.0
  qf_theta: 5.0

  # Object costs
  w_effort: 0.01                # control effort weight  
  wrench_fraction: 1.5          # point/box plant wrench fraction
  w_rate: [2.0, 2.0, 1.0]       # object wrench smoothness
  w_obstacle: 10.0              # object-vs-obstacle proximity weight: w_obstacle * exp(-d/obstacle_decay)
  obstacle_decay: 0.01          # object-vs-obstacle proximity decay rate in meters

  # Pusher costs
  r_r: 0.05                     # squared control effort; pinned at 0.10-0.12/step
  w_ee: 50.0                    # approach: pull the tip toward the object
  r0: 0.02                      # < block half-width, so approach never goes slack in meters
  w_align: 15.0                 # stay behind the object (soft cone)
  gamma0_deg: 50.0              # alignment cone half-angle
  q_ramp_per_step: 0.05         # goal tracking gain multiplier per control step
  q_ramp_max: 20.0              # maximum goal tracking multiplier of the goal tracking gain
  w_robot_contact: 0.1          # robot-vs-obstacle contact weight: w * force^2, so a hard hit costs far more than a graze. Proximity is free. UNMEASURED weight.
  shaping_fade_dist: 0.20       # shaping fade distance in meters: formula ||x - x_goal||/shaping_fade_dist -> 0 as x -> x_goal
  w_tilt: 30.0                # keep the stick pointing down (3D only)
  w_z_tip: 8.0                # keep the tip at the block's mid-height (3D only)
  project_gate_pos: 0.0       # object near-goal snap; off, same as xarm6

admm:
  robot_opt: mppi               # robot optimizer: mppi | cem | ps | cbo
  object_opt: mppi              # object optimizer: mppi | cem | ps | cbo
  n_admm: 4
  rho: 2.0                      # ADMM step size
  rho_torque: 5.0               # ADMM step size for torque
  rho_adapt: false              # residual-balancing rule; off => rho stays at `rho`
  rho_bound_factor: 8.0         # when rho_adapt: how far the rule may move rho
  gamma: 0.1
  eps_r: 0.5
  eps_s: 0.5
  noise_min: 0.0
  noise_kappa: 0.0
  noise_max: 0.0
  consensus_alpha: 1.0
  local_goal: true

run:
  seed: 5
  steps: 1000
  goal_pos_tol: 0.05
  goal_theta_tol: 0.1
  show_samples: true
  show_optimal: true
