world3d:
  planning_dt: 0.05           # sub-optimizer rollout timestep
  robot_substeps: 5           # MJX physics steps per planning step in the ROBOT rollout, so it integrates contact at planning_dt/5 = 0.01s while the horizon keeps its 24 steps. Costs 5x in the robot rollout. Measured against the execution model on 100 logged states: the object travel the planner predicts is 0.723x the executed travel at 1 substep, 0.978x at 5, 1.000x at 10; per-step disagreement 3.44mm -> 0.38mm -> 0.16mm
  object_substeps: 2            # OBJECT WORLD: MJX steps per planning step in the OBJECT rollout, under --plant mujoco. 1 gives eq. 5's own coarse integration
  exec_timestep: 0.002        # execution-model MuJoCo timestep
  exec_iterations: 100        # number of iterations for the execution model
  exec_ls_iterations: 50      # number of iterations for the local search

sampler:
  num_samples: 128            # number of samples for the sampler
  horizon: 24                 # consensus horizon H, in steps of planning_dt
  robot_num_knots: 6          # number of knots for the robot spline
  robot_spline: linear        # robot spline type: linear | cubic | quintic
  object_spline: zero         # object spline type: zero | linear | cubic | quintic
  iterations: 1               # optimizer passes per control step: flat 3D baselines, and the object world. ADMM's own blocks get `n_admm` passes instead, so matching this to n_admm is what makes an object-only run the same experiment as the ADMM block
  mppi:                       # MPPI optimizer parameters
    noise_level: 0.3
    temperature: 0.5          # temperature for the MPPI optimizer: higher temperature -> more exploration (0.0: greedy, 1.0: random)
  cem:                        # CEM optimizer parameters
    num_elites: 8
    sigma_start: 0.5
    sigma_min: 0.1
  ps:                         # PS optimizer parameters
    noise_level: 0.5
  cbo:                        # CBO optimizer parameters
    initial_noise_level: 0.5
    temperature: 0.5
    consensus_weight: 1.0
    noise_weight: 1.0
    step_size: 0.1
  object:                     # Object optimizer parameters
    num_samples: 256          # object block only; unset shares `num_samples`
    mppi:
      noise_level: 0.30       # noise level for the MPPI optimizer  
      temperature: 0.5        # temperature for the MPPI optimizer

costs:
  # x^o = object SE(2) pose, g = goal, p = xy, u = robot command,
  # w = object wrench, d = distance from the object's footprint to the
  # NEAREST obstacle, f = robot-vs-obstacle contact normal force [N].

  # Shared costs -- read by BOTH subproblems, at the same weight
  q_pos: 200.0                  # goal position gain:    ell_o = ramp * (q_pos*||p - p_g||^2 + q_theta*wrap(th - th_g)^2)
  q_theta: 5.0                  # goal heading gain:     same formula, the wrap(th - th_g)^2 half
  qf_pos: 200.0                 # terminal position gain: ell_f = qf_pos*||p_H - p_g||^2 + qf_theta*wrap(th_H - th_g)^2
  qf_theta: 5.0                 # terminal heading gain:  same formula, the wrap(th_H - th_g)^2 half
  q_ramp_per_step: 0.005        # goal-tracking ramp, BOTH blocks, on the goal terms only: ramp = clip(1 + q_ramp_per_step * t/dt, 1, q_ramp_max), t read once per rollout (not per step inside it), so the ramp is constant across a horizon. Reaches the cap after (q_ramp_max - 1)/q_ramp_per_step steps
  q_ramp_max: 10.0              # cap on that ramp
  w_obstacle: 20.0              # object-vs-obstacle proximity: w_obstacle * exp(-d/obstacle_decay), nearest obstacle only
  obstacle_decay: 0.02          # decay length [m] in that exponential: halves the penalty every obstacle_decay*ln2 of clearance
  w_support: 200.0              # object-vs-TABLE-EDGE, a keep-IN region: w_support * sum over footprint of clip(d + support_margin, 0, inf)^2
  support_margin: 0.2           # how far inside the rim [m] it starts; 0 until then

  # Object costs -- object subproblem only.
  w_effort: 0.01                # object wrench effort: w_effort * ||w||^2
  w_rate: [2.0, 2.0, 1.0]       # object wrench rate, per axis [fx, fy, tau]: sum_t sum_i w_rate[i] * (w[t+1,i]/limit_i - w[t,i]/limit_i)^2
  w_contact_rate: [16.0, 16.0, 1.0]  # contact-point rate, per axis [px, py, lambda], consensus=contact_point only: sum_t sum_i w[i]*(A[t+1,i]/scale_i - A[t,i]/scale_i)^2, scale = [r_body, r_body, f_max]. The only term that knows relocating a contact costs the ARM many steps while the object block can teleport it for free; too low and the robot chases a target that moves every step

  # Pusher costs -- robot subproblem only.
  w_robot_effort: 0.05          # robot control effort: fade * w_robot_effort * ||u||^2
  w_approach: 20.0              # approach: fade * w_approach * max(||p_ee - p||^2 - r0^2, 0), pulls the tip onto the object
  r0: 0.05                      # approach deadband radius [m]: no approach cost inside ||p_ee - p|| <= r0; < block half-width so it never goes slack
  w_align: 15.0                 # stay behind the object: fade * w_align * max(cos(gamma0_deg) - cos(angle), 0), angle between (p - p_ee) and (p_ref - p)
  gamma0_deg: 50.0              # alignment cone half-angle [deg] in that hinge: zero cost while the tip is within gamma0_deg of the push direction
  w_robot_contact: 0.1          # robot-vs-obstacle contact: w_robot_contact * f^2, so a hard hit costs far more than a graze. Proximity is free. UNMEASURED weight.
  shaping_fade_dist: 0.20       # fade = clip(||p - p_goal|| / shaping_fade_dist, 0, 1): 1 far away, 0 at the goal. FADED: w_approach, w_align, w_robot_effort, ADMM consensus penalty (rho + dual step). NOT FADED: w_robot_contact and every goal/object term (q_*, qf_*, w_obstacle, w_support, w_effort, w_rate). The stick terms the arm fades (w_tilt, w_z_tip*) are forced to 0 for this embodiment

admm:
  plant: mujoco                 # OBJECT WORLD ONLY: dynamics the run predicts AND executes with -- analytic (eq. 5 both sides) | mujoco (MJX plans, MuJoCo executes). Both are self-consistent; there is no mixed mode. The 3D `admm` subcommand has its own --plant and does NOT read this: switching it there would reprice every recorded 3D run
  friction: box                 # OBJECT WORLD ONLY, --plant mujoco only: shape of the simulated support friction -- box (per-DoF frictionloss, the only one that converges on every scene) | cone (eq. 5's own coupled ellipsoid) | wrench (eq. 5's force balance; diverges, the block coasts). See oim/worlds/object_only/plant.py
  robot_opt: mppi               # robot optimizer: mppi | cem | ps | cbo
  wrench_fraction: 1.0          # object action scale: action_scale = wrench_fraction * wrench_limit. Read under consensus wrench|object_pose, whose action IS the wrench. Not a cost weight -- it sizes the object block's action, which is why it lives here
  contact_fraction: 1.0         # lambda's ceiling under consensus contact_point: f_max = contact_fraction * mu*m*g. Its own knob because the two bound different things -- a coupled 3-channel wrench (ceiling fraction*sqrt(3) on the norm) against one scalar normal force that must clear breakaway alone. Unset -> falls back to wrench_fraction
  object_opt: mppi              # object optimizer: mppi | cem | ps | cbo
  consensus: wrench    # what the blocks agree on: wrench = [fx, fy, tau]; contact_point = [px, py, lambda], a boundary point in the object's body frame + normal force, with w = J_c^T f derived at the current pose each step; object_pose = [x, y, yaw], the pose eq. 5 produces -- the block still samples wrenches, so the object-only world behaves like `wrench`, and yaw is wrapped in every ADMM subtraction
  n_admm: 4
  lagged_consensus: "off"       # off | robot | both. Where each block reads A from. `off` is Algorithm 4: each block re-simulates its own outgoing mean, and those two single-trajectory rollouts are 37% of a solve (330 ms of 894 on xarm6/open_table) because a solve is bound by sequential MJX steps, not batch width -- the robot block measured 84.45 ms at 256 rollouts against 84.34 at 257. `robot`/`both` carry the INCOMING mean as one free extra row of the sample batch instead, so z and the duals at round l are built from A(x_{l-1}): the same number of block updates and consensus updates, offset by one round. Measured 871 -> 660 ms per control step at `robot`. Not Algorithm 4, so a run under it is not comparable to one without
  rho: 0.0                      # ADMM step size
  rho_torque: 0.0               # ADMM step size for torque
  rho_adapt: false              # residual-balancing rule; off => rho stays at `rho`
  rho_bound_factor: 8.0         # when rho_adapt: how far the rule may move rho
  gamma: 0.1                    # ADMM dual variable scaling: gamma = gamma_max * gamma_min^(t/T), gamma_max = 1.0, gamma_min = 0.01
  consensus_object_weight: 0.5  # object block's share w_o of the consensus update: z <- w_o*(A^o + y_o) + (1 - w_o)*(A^r + y_r). 0.5 = the paper's average; >0.5 tilts z toward the object block's cleaner 3-DOF plan, <0.5 toward the robot's realized wrench
  # RESCALED for `ConsensusSpace.residual_norm`, which now reports the RMS
  # per channel instead of the 2-norm over the concatenated (2H, dim)
  # array. The old 0.5 divided by sqrt(2*H*dim) is 0.042, so 0.05 is
  # the same decision with a round number -- and it no longer moves when
  # the horizon does. Reads as "typical disagreement per channel, as a
  # fraction of the consensus scale".
  eps_r: 0.05                   # ADMM primal residual tolerance
  eps_s: 0.05                   # ADMM dual residual tolerance
  local_goal: true              # robot block tracks the object block's own PLAN instead of the global goal, in ell_o and the terminal term only; snaps back to the global goal inside shaping_fade_dist
  local_goal_lookahead: 0.10    # how tightly it follows that plan: aim at the first planned pose >= this far [m] from the object, re-picked every rollout step so the carrot slides along the route. 0 = aim at the plan's endpoint only (the old behaviour)

run:
  seed: 5
  steps: 1000
  goal_pos_tol: 0.05
  goal_theta_tol: 0.1
  record: true                  # mp4 of the simulated scene, candidates + chosen plan composited per step. Object world: needs a MuJoCo-EXECUTING plant, `analytic` has no scene to film. Override with --record (there is no --no-record)
  warp: false                   # 3D ONLY: MuJoCo Warp rollouts instead of JAX. Also disables JAX GPU preallocation, which Warp needs. Override with --warp / --no-warp
  headless: false               # 3D ONLY: no viewer, run `steps` steps and save a run file. Override with --headless / --no-headless
  scene: clutter                # OBJECT WORLD ONLY: which SCENES key to run. The 3D scripts name their own scene and ignore this
  start: null                   # OBJECT WORLD: start/goal pose key from examples/poses/<scene>.yaml, or `random`. null = the scene's own
  goal: null
  no_plot: false                # true skips the summary PNG. Override with --plot
  no_jit: false                 # true runs eager, to breakpoint inside the limit-surface dynamics. Override with --jit
  show_samples: true
  show_optimal: true
  show_contact_point: false     # red dot on the object at the agreed contact point, at each planned pose. Needs consensus: contact_point; ignored under wrench
