world3d:
  planning_dt: 0.05           # sub-optimizer rollout timestep
  exec_timestep: 0.002        # execution-model MuJoCo timestep
  exec_iterations: 100
  exec_ls_iterations: 50

world2d:
  mass: 2.0
  mu: 0.4                     # object/support friction
  mu_c: 0.5                   # robot/object friction
  f_max: 4.0                  # cap on the normal contact force

sampler:
  num_samples: 64
  horizon: 32                 # consensus horizon H, in steps of planning_dt
  robot_num_knots: 4
  robot_spline: linear
  object_spline: zero         # the object block always uses num_knots = horizon
  iterations: 1               # flat baselines only; see xarm6.yaml
  mppi:
    noise_level: 0.214
    temperature: 0.5
  cem:
    num_elites: 8
    sigma_start: 0.5
    sigma_min: 0.1
  ps:
    noise_level: 0.5
  cbo:
    initial_noise_level: 0.5
    temperature: 0.5
    consensus_weight: 1.0
    noise_weight: 1.0
    step_size: 0.1
  object:
    num_samples: 256          # object block only; unset shares `num_samples`
    mppi:
      noise_level: 0.25
      temperature: 0.5

costs:
  q_pos: 200.0
  q_theta: 40.0
  qf_pos: 200.0
  qf_theta: 40.0

  w_effort: 0.01
  wrench_fraction: 2.0        # point/box plant
  w_rate: [2.0, 2.0, 1.0]     # object wrench smoothness, same as xarm6
  w_obstacle: 60000.0
  obstacle_margin: 0.015

  r_r: 0.05                   # squared control effort; pinned at 0.10-0.12/step
  w_ee: 10.0                  # approach: pull the tip toward the object
  r0: 0.02                    # < block half-width, so approach never goes slack
  w_align: 15.0               # stay behind the object (soft cone)
  gamma0_deg: 30.0            # alignment cone half-angle
  w_tilt: 30.0                # keep the stick pointing down (3D only)
  w_tip_z: 8.0                # keep the tip at the block's mid-height (3D only)
  # Full shaping beyond 15 cm; linear → 0 at the goal. Approach stays on.
  shaping_fade_dist: 0.15
  project_gate_pos: 0.0       # object near-goal snap; off, same as xarm6

admm:
  robot_opt: mppi       # mppi | cem | ps | cbo
  object_opt: mppi
  n_admm: 4
  rho: 2.0
  rho_adapt: false            # residual-balancing rule; off => rho stays at `rho`
  rho_bound_factor: 8.0       # when rho_adapt: how far the rule may move rho
  rho_torque: 5.0
  gamma: 0.1
  eps_r: 0.5
  eps_s: 0.5
  noise_min: 0.0
  noise_kappa: 0.0
  noise_max: 0.0
  consensus_alpha: 1.0
  local_goal: true

run:
  seed: 5
  steps: 1000
  goal_pos_tol: 0.05
  goal_theta_tol: 0.1
  show_samples: true
  show_optimal: true
