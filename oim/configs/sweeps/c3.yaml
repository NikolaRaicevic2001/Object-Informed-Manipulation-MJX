# C3+ (Push Anything) baseline sweep: four tabletop tasks, five seeds, one
# fixed parameter set (locked in build_flat_3d). Same scenes and seeds as the
# admm sweep in launch.yaml, so the two tables merge row for row. Scored by
# `oim/run_eval.py`.
sweep:
  task:
    - { script: open_table }       # 180 deg flip, no obstacles
    - { script: single_obstacle }  # one cube on the direct path
    - { script: shelf_gap }        # gap as wide as the T is long
    - { script: ycb_clutter }      # cube + three YCB objects
    # - { script: icra_sign }      # non-convex C -> contact-normal blowup

  algorithm: [c3]
  seed: [0, 1, 2, 3, 4]

fixed:
  robot: point
  warp: false          # C3 plans against its own LCS; warp buys it nothing
  record: true
  show_samples: false  # C3 has no sample population to overlay
  show_optimal: false
  no_plot: false
  steps: 2000          # same cap as the admm sweep, so `steps` censors alike
  headless: true
