sweep:
  task:
    - { script: open_table }        # 180 deg flip, no obstacles
    - { script: single_obstacle }   # one cube on the direct path
    - { script: shelf_gap }         # gap as wide as the T is long
    - { script: ycb_clutter }       # cube + three YCB objects
    - { script: icra_sign }         # C-block, 90 deg turn, seven glyphs
    - { script: slalom }            # three alternating gates, no straight line through

  object:                           # scene = the T-block; the rest are YCB
    - hammer                        # hammer: concave footprint
    - sugar_box                     # large flat rectangle
    - power_drill                   # L-shaped, offset centre of mass
    - banana                        # crescent: concave footprint

  algorithm:                                                                                  # best variant of each, all at temperature 0.1
    - mppi                                                                                    # flat baseline
    - { algorithm: mppi, iterations: 8 }                                                      # flat baseline with 8 iterations
    - { algorithm: admm, consensus: object_pose }                                             # [x, y, yaw]

  seed: []
  start: [1,2,3,4,5]
  goal: [1,2,3,4,5]

ablate: {}                                          # no knob varied: each algorithm runs its own best variant

fixed:
  robot: xarm6            # the robot to use for the simulation
  steps: 1000             # number of steps to run the simulation for
  iterations: 1           # flat baselines only; ADMM uses n_admm
  temperature: 0.1        # the winning lambda for all three (Table I)

