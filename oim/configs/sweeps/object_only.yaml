sweep:
  task:
    - { script: object_only }

  scene:
    - open_table       # 180 deg flip, no obstacles
    - single_obstacle  # one cube on the direct path
    - shelf_gap        # gap as wide as the T is long
    - ycb_clutter      # cube + three YCB objects
    - icra_sign        # C-block, 90 deg turn, seven glyphs

  wrench_fraction: []

  seed: [1]

fixed:
  robot: xarm6      # picks the config and scene variant; no robot is simulated
  # Which dynamics the run uses, predicting and executing together:
  #   analytic     eq. 5 both sides -- no model error
  #   model-error  plan eq. 5, execute MuJoCo -- how good eq. 5 is
  #   mujoco       MJX both sides -- self-consistent, like a deployment
  plant: model-error
  steps: 500
  iterations: 4     # match n_admm, so the block gets ADMM's update budget
  record: true      # gif per cell: candidates + chosen plan, one frame/step
