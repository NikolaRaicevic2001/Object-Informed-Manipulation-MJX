sweep:
  task:
    - { script: open_table }        # 180 deg flip, no obstacles
    # - { script: single_obstacle }   # one cube on the direct path
    # - { script: shelf_gap }         # gap as wide as the T is long
    # - { script: ycb_clutter }       # cube + three YCB objects
    # - { script: icra_sign }         # C-block, 90 deg turn, seven glyphs

  algorithm: [admm]

  robot_opt: [mppi]
  object_opt: [mppi]

  horizon: []
  samples: []

  n_admm: []
  rho: []
  gamma: []
  consensus_alpha: []

  start: []
  goal: []  
  seed: [1]

fixed:
  robot: point          # the robot to use for the simulation
  plant: mujoco         # the dynamics to use for the simulation
  warp: true            # True: warp the simulation, False: don't warp the simulation
  record: true          # True: record the simulation, False: don't record the simulation
  no_plot: false        # True: no plots, False: plots saved in results/runs/*.json
  steps: 2000           # number of steps to run the simulation for
  headless: true        # True: no GUI, False: GUI
  iterations: 1         # number of iterations to run the algorithm for
