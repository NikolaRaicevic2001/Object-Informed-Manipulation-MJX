sweep:
  task:
    - { script: open_table }        # 180 deg flip, no obstacles
    # - { script: single_obstacle }   # one cube on the direct path
    # - { script: shelf_gap }         # gap as wide as the T is long
    # - { script: ycb_clutter }       # cube + three YCB objects
    # - { script: icra_sign }         # C-block, 90 deg turn, seven glyphs

  algorithm: [admm]

  robot_opt: [mppi]
  object_opt: [mppi]

  horizon: []
  samples: []

  n_admm: []
  rho: []
  gamma: []
  consensus_alpha: []

  start: []
  goal: []
  seed: [1]       # Pose from the task's file (oim/utils/poses.py), seeded by `seed`. Each seed selects a random start/goal pose.      

fixed:
  robot: point          # the robot to use for the simulation
  plant: mujoco         # dynamics the OBJECT block plans with (the robot block and execution are always MuJoCo):
                        #   mujoco    MJX rollout of a block-only model, driven by the consensus wrench (MJXObjectRollout)
                        #   analytic  the limit surface, eq. 5 (AnalyticObjectRollout) -- the default
                        # 'model-error' (plan eq. 5, execute MuJoCo) is object-only-world only; see oim/worlds/object_only/plant.py
  warp: true            # True: warp the simulation, False: don't warp the simulation
  record: true          # True: record the simulation, False: don't record the simulation
  no_plot: false        # True: no plots, False: plots saved in results/runs/*.json
  steps: 300            # number of steps to run the simulation for
  headless: true        # True: no GUI, False: GUI
  iterations: 1         # number of iterations to run the algorithm for
