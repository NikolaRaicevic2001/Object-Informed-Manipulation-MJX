world3d:
  planning_dt: 0.05       # planner rollout timestep
  exec_timestep: 0.002    # execution model timestep
  exec_iterations: 100    # execution model solver iterations
  exec_ls_iterations: 50  # execution model line-search iterations

world2d:                  # unused for this robot
  mass: 2.0
  mu: 0.4                 # object/support friction
  mu_c: 0.5               # robot/object friction
  f_max: 4.0              # cap on the normal contact force

sampler:
  # Proven budget (122604: end 0.07 m). Larger N/H hurt.
  num_samples: 128
  horizon: 32
  robot_num_knots: 4
  robot_spline: linear
  object_spline: zero
  iterations: 1
  mppi:
    noise_level: 0.3
    temperature: 0.5
  cem:
    num_elites: 8
    sigma_start: 0.5
    sigma_min: 0.1
  ps:
    noise_level: 0.5
  cbo:
    initial_noise_level: 0.5
    temperature: 0.5
    consensus_weight: 1.0
    noise_weight: 1.0
    step_size: 0.1
  object:
    mppi:
      noise_level: 0.5
      temperature: 0.5

costs:
  # Baseline from best run so far (133802: end 0.028 m). Only change vs
  # that run: shaping_fade_dist > 0 so align/tilt/tip_z ease off inside
  # this radius and q_*/qf_* own the finish. onset is gone — it made the
  # arm fold and never touch the block (132755).
  q_pos: 200.0
  q_theta: 40.0
  qf_pos: 200.0
  qf_theta: 40.0

  w_effort: 0.01
  w_obstacle: 60000.0
  obstacle_margin: 0.015

  r_r: 0.05
  w_ee: 10.0
  r0: 0.02
  w_align: 15.0
  gamma0_deg: 30.0
  w_tilt: 30.0
  w_tip_z: 8.0
  # Full shaping beyond 15 cm; linear → 0 at the goal. Approach stays on.
  shaping_fade_dist: 0.15

admm:
  robot_opt: mppi
  object_opt: mppi
  n_admm: 4
  rho: 10.0
  gamma: 0.1
  eps_r: 0.5
  eps_s: 0.5
  noise_min: 0.0
  noise_kappa: 0.0
  noise_max: 0.0
  consensus_alpha: 1.0

run:
  seed: 5
  steps: 1000
  goal_pos_tol: 0.05
  goal_theta_tol: 0.1
  show_samples: false
  show_optimal: false
