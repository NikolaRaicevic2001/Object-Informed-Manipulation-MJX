# Default parameters for the point-mass 3D robot.
#
# Every `examples/` script loads `oim/configs/{robot}.yaml` and uses the
# values below as argparse defaults, so a bare `uv run python
# examples/<task>.py admm` runs exactly what is written here. Passing a flag
# overrides that one value and nothing else -- the file is the baseline, the
# command line is the exception. There is no flag to choose the file: it is
# a property of `--robot`.
#
# That means two runs of the same algorithm are configured identically
# unless you deliberately differ, and comparing two algorithms compares the
# same sampler budget, physics and execution model rather than whatever a
# flag happened to be set to.
#
# One file per robot, not per scene: `--scene` picks the 3D layout
# (`clutter`, or one of the five tabletop scenes) and every scene is run
# under the same numbers, so a scene comparison is not confounded by
# tuning. `--robot xarm6` selects `xarm6.yaml` instead, a separate file
# precisely so tuning the arm cannot silently retune the point mass. (The
# tabletop scenes are xArm6-only, so they always read that file, never
# this one.)

world3d:
  planning_dt: 0.05 # sub-optimizer rollout timestep
  exec_timestep: 0.002 # execution-model MuJoCo timestep
  exec_iterations: 100
  exec_ls_iterations: 50

# Used only with `--world 2d`; the scenario itself comes from `--env`.
world2d:
  mass: 2.0
  mu: 0.4 # object/support friction
  mu_c: 0.5 # robot/object friction
  f_max: 4.0 # cap on the normal contact force

sampler:
  num_samples: 64
  horizon: 15 # consensus horizon H, in steps of planning_dt
  robot_num_knots: 4
  robot_spline: linear
  object_spline: zero # the object block always uses num_knots = horizon
  iterations: 1 # flat baselines only; see xarm6.yaml
  mppi:
    # Was 0.5, tuned against this file's own horizon: 15. MPPI.sample_knots
    # adds noise_level directly to each spline knot's *velocity*, so at a
    # fixed noise_level a longer horizon holds that same noisy velocity for
    # longer before the rollout ends, and the sampled endpoint spread grows
    # with it -- measured (open_table, point robot, no nominal drift) mean
    # final displacement 0.205 m at horizon=15 vs. 0.476 m at horizon=35,
    # the latter comparable to the whole table workspace, swamping any
    # task-directed signal in the sample cloud. 0.214 = 0.5 * 15/35 rescales
    # for horizon=35 specifically -- there is no CLI override for this, so
    # if horizon goes back to (or past) 15, rescale this again to match.
    noise_level: 0.214
    temperature: 0.5
  cem:
    num_elites: 8
    sigma_start: 0.5
    sigma_min: 0.1
  ps:
    noise_level: 0.5
  cbo:
    initial_noise_level: 0.5
    temperature: 0.5
    consensus_weight: 1.0
    noise_weight: 1.0
    step_size: 0.1

# Cost weights, for both ADMM blocks and the flat baselines. See
# `xarm6.yaml`'s `costs:` block for what each one does and what has been
# measured about it; the values here are the same defaults, kept in this
# file too so the two robots can be retuned independently (the point mass
# has no stick to keep vertical, so `w_tilt`/`w_tip_z` are inert for it).
# Anything omitted falls back to `oim.tasks.pusht.DEFAULT_COSTS`.
costs:
  q_pos: 40.0
  q_theta: 10.0
  qf_pos: 500.0
  qf_theta: 150.0
  w_effort: 0.01
  w_obstacle: 60000.0
  obstacle_margin: 0.015
  r_r: 0.05
  w_ee: 40.0
  r0: 0.02
  w_align: 15.0
  gamma0_deg: 15.0
  w_tilt: 30.0
  w_tip_z: 8.0

admm:
  robot_opt: mppi # mppi | cem | ps | cbo
  object_opt: mppi
  n_admm: 8
  rho: 10.0
  gamma: 0.1
  # The residual is a Frobenius norm over (2H, 3) normalized entries, so
  # the paper's 0.05 is unreachable at H = 15 and the early exit would
  # never fire.
  eps_r: 0.5
  eps_s: 0.5
  # Residual-driven noise annealing (paper Algorithm 4 step 8) is off: the
  # primal residual never converges for this task, so the noise sits pinned
  # near noise_max instead of annealing. Measured over 600 steps at one
  # seed: final position error 4.65 with it on, 2.01 with it off.
  noise_min: 0.0
  noise_kappa: 0.0
  noise_max: 0.0
  consensus_alpha: 1.0

run:
  seed: 5
  steps: 200
  # One definition of "reached", recorded into every run file so
  # `oim/run_eval.py` can re-derive success -- and so a flat baseline and
  # ADMM are never scored against different thresholds.
  goal_pos_tol: 0.05
  goal_theta_tol: 0.05
  # ADMM only (`--show-samples`/`--show-optimal`): the trajectory overlay
  # costs real time to compute and render, so both default off. Each is
  # independent: samples alone shows the candidate cloud with no chosen
  # path drawn, optimal alone shows just the chosen path, both together is
  # the full picture.
  show_samples: false
  show_optimal: false
