# ycb_clutter: push the T past the cube plus three YCB objects.
#
# Four obstacles across the |y| <= 0.3 band, so the starts are tighter than
# single_obstacle's even though the nominal pose is identical -- the sugar
# box at (0.22, 0.20) is the first thing the block meets. Comments give each
# pose's measured clearance. See poses/README.md for the conventions.#
# Re-laid out 2026-08-25 with the scene family: the corridor now runs
# y = +0.4 -> -0.4 with every obstacle inside |y| <= 0.3, so both ends of
# the task start clear of the field. Each variant keeps its offset from the
# nominal pose in CORRIDOR coordinates (along-track, cross-track); yaw
# jitter is unchanged. Clearances below are re-measured.

starts:
