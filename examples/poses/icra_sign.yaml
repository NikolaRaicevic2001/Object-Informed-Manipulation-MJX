# icra_sign: push the C into its empty slot in the "ICRA 2026" row.
#
# The row reads -y -> +y, so the C's slot is the second letter of "ICRA" at
# y = -0.40 -- the same goal line every other scene uses -- and the C starts
# on the +y half beside "2026", 0.2 m nearer the arm in x so it begins clear
# of the row's own x band. The slot opening is 23.4 cm against a C that is
# 9.7 cm across; every other gap between adjacent glyphs is 4.4-6.7 cm, so
# no pose fits in them with margin. Goal yaw jitter is held to +/-0.35 rad
# for the same reason. See poses/README.md for the conventions.#
# Re-laid out 2026-08-25 with the scene family: the corridor now runs
# y = +0.4 -> -0.4 with every obstacle inside |y| <= 0.3, so both ends of
# the task start clear of the field. Each variant keeps its offset from the
# nominal pose in CORRIDOR coordinates (along-track, cross-track); yaw
# jitter is unchanged. Clearances below are re-measured.
#
# Goal "3" carries less yaw jitter than the corridor pattern would give it
# (-0.30 rad, not -0.35): at the full value the C's corner reaches within
# 2.4 cm of the R, below the 3 cm minimum.

starts:
  "1": [0.3000, 0.4000, 0.0000] # the scene's original start, 10.0 cm clear
  "2": [0.2779, 0.4264, 0.0579] # 12.3 cm
  "3": [0.3007, 0.4383, -0.4082] # 8.5 cm
  "4": [0.2910, 0.3534, 0.3282] # 9.7 cm
  "5": [0.3284, 0.3896, 0.2806] # 7.5 cm

goals:
  "1": [0.5000, -0.4000, 1.5708] # the scene's original goal, 5.1 cm clear
  "2": [0.5230, -0.4262, 1.6692] # 5.6 cm
  "3": [0.5247, -0.4041, 1.2708] # 4.2 cm
  "4": [0.5107, -0.4221, 1.1996] # 4.9 cm
  "5": [0.4845, -0.4286, 1.1630] # 4.2 cm
