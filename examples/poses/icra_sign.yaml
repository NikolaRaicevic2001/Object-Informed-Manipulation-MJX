# icra_sign: push the C into its empty slot in the "ICRA 2026" row.
#
# The goals all sit in the one gap wide enough for the C -- between the I
# at y = 1.00 and the R at y = 0.70, which is the slot the C belongs in.
# That opening is 23.4 cm; every other gap between adjacent glyphs is
# 4.4-6.7 cm (the 15 cm space between "ICRA" and "2026" aside), against a
# C that is 9.7 cm across and 10.3 cm tall, so no pose fits in them with
# margin. Goal yaw jitter is held to +/-0.35 rad rather than the other
# scenes' 0.45 for the same reason. Comments give each pose's measured
# clearance. See poses/README.md for the conventions.
#
# Re-measured 2026-08-19 against the re-cut glyph set: the C went from
# 7.0 to 9.7 cm wide and every obstacle hull grew with it, so every
# clearance below is smaller than it was. Goal "3" moved +10 mm in y
# (0.8237 -> 0.8337) to stay above the 3 cm minimum; x and yaw are
# untouched, and no other pose needed changing.

starts:
  "1": [0.0000, 0.0000, 0.0000] # the scene's original start, 10.0 cm clear
  "2": [-0.0809, 0.0684, 0.3282] # 16.7 cm
  "3": [-0.0629, -0.0226, 0.2806] # 15.2 cm
  "4": [0.0575, 0.0054, 0.2024] # 3.3 cm
  "5": [-0.0336, 0.0836, -0.0526] # 13.2 cm

goals:
  "1": [0.2000, 0.8500, -1.5708] # the scene's original goal, 5.1 cm clear
  "2": [0.1535, 0.8796, -1.8424] # 5.2 cm
  "3": [0.1397, 0.8337, -1.3782] # 3.7 cm (was y=0.8237, 2.9 cm)
  "4": [0.1081, 0.8569, -1.8293] # 4.7 cm
  "5": [0.1101, 0.9022, -1.6669] # 3.8 cm
